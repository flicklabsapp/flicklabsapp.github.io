<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flick Labs</title>
<meta name="description" content="Flick Labs makes simple, useful apps and games for Android.">
<link rel="icon" href="icons/spaciora.png">
<style>
:root{--bg:#F5F6FA;--card:#fff;--ink:#121826;--muted:#5D6779;--line:#DEE3EC;--accent:#245DEC;--accent2:#E5573F}
@media (prefers-color-scheme:dark){:root{--bg:#0D1219;--card:#151D28;--ink:#E8EDF4;--muted:#95A2B4;--line:#243140;--accent:#7B9BFF;--accent2:#FF7A63}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:28px max(18px,env(safe-area-inset-left)) 28px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-weight:900;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:inline-block}
select{font:inherit;font-size:14px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
h1{font-size:clamp(30px,6vw,46px);line-height:1.08;letter-spacing:-.03em;margin:34px 0 10px;text-wrap:balance}
.lead{color:var(--muted);font-size:18px;max-width:560px;margin:0}
h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:44px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.app{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.app img,.app .ph{width:64px;height:64px;border-radius:16px}
.ph{display:grid;place-items:center;color:#fff;font-weight:900;font-size:26px}
.app b{font-size:18px}
.app p{margin:0;color:var(--muted);font-size:14.5px;flex:1}
.links{display:flex;gap:12px;flex-wrap:wrap;font-size:14px}
.links a{color:var(--accent);text-decoration:none;font-weight:600}
.links a:hover{text-decoration:underline}
.soon{font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:2px 8px;align-self:flex-start}
.contact{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between}
.contact a{color:var(--accent);font-weight:700;text-decoration:none;overflow-wrap:anywhere}
footer{color:var(--muted);font-size:13px;margin-top:34px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo"><i></i>Flick Labs</div>
    <select id="lang" aria-label="Language"></select>
  </div>
  <h1 id="h1">Simple, useful apps and games for Android.</h1>
  <p class="lead" id="lead">Small tools that save you time and space, and games you can play in a few minutes. Available in 10 languages.</p>

  <h2 id="hApps">Our apps</h2>
  <div class="grid" id="apps"></div>

  <h2 id="hContact">Contact</h2>
  <div class="contact"><span id="cText">Questions, feedback or support requests</span><a href="mailto:flicklabsapp@gmail.com">flicklabsapp@gmail.com</a></div>

  <footer>© 2026 Flick Labs</footer>
</div>
<script>
const T={
en:{n:'English',h1:'Simple, useful apps and games for Android.',lead:'Small tools that save you time and space, and games you can play in a few minutes. Available in 10 languages.',apps:'Our apps',contact:'Contact',c:'Questions, feedback or support requests',soon:'Coming soon',priv:'Privacy policy'},
de:{n:'Deutsch',h1:'Einfache, nützliche Apps und Spiele für Android.',lead:'Kleine Werkzeuge, die dir Zeit und Speicher sparen, und Spiele für ein paar Minuten zwischendurch. In 10 Sprachen verfügbar.',apps:'Unsere Apps',contact:'Kontakt',c:'Fragen, Feedback oder Support-Anfragen',soon:'Demnächst',priv:'Datenschutzerklärung'},
tr:{n:'Türkçe',h1:'Android için sade ve kullanışlı uygulamalar ve oyunlar.',lead:'Sana zaman ve yer kazandıran küçük araçlar, birkaç dakikada oynanan oyunlar. 10 dilde.',apps:'Uygulamalarımız',contact:'İletişim',c:'Soru, öneri ve destek talepleri',soon:'Yakında',priv:'Gizlilik politikası'},
es:{n:'Español',h1:'Apps y juegos sencillos y útiles para Android.',lead:'Pequeñas herramientas que te ahorran tiempo y espacio, y juegos para unos minutos. Disponibles en 10 idiomas.',apps:'Nuestras apps',contact:'Contacto',c:'Preguntas, comentarios o soporte',soon:'Próximamente',priv:'Política de privacidad'},
fr:{n:'Français',h1:'Des applis et des jeux simples et utiles pour Android.',lead:"De petits outils qui vous font gagner du temps et de l'espace, et des jeux pour quelques minutes. Disponibles en 10 langues.",apps:'Nos applis',contact:'Contact',c:"Questions, avis ou demandes d'assistance",soon:'Bientôt',priv:'Politique de confidentialité'},
it:{n:'Italiano',h1:'App e giochi semplici e utili per Android.',lead:'Piccoli strumenti che ti fanno risparmiare tempo e spazio, e giochi da pochi minuti. Disponibili in 10 lingue.',apps:'Le nostre app',contact:'Contatti',c:'Domande, feedback o richieste di assistenza',soon:'In arrivo',priv:'Informativa sulla privacy'},
ja:{n:'日本語',h1:'Android向けの、シンプルで便利なアプリとゲーム。',lead:'時間と容量を節約できる小さなツールと、数分で遊べるゲーム。10言語に対応。',apps:'アプリ一覧',contact:'お問い合わせ',c:'ご質問・ご意見・サポート',soon:'近日公開',priv:'プライバシーポリシー'},
ko:{n:'한국어',h1:'Android를 위한 간단하고 유용한 앱과 게임.',lead:'시간과 공간을 아껴 주는 작은 도구, 몇 분이면 즐길 수 있는 게임. 10개 언어 지원.',apps:'앱 목록',contact:'문의',c:'질문, 의견 또는 지원 요청',soon:'출시 예정',priv:'개인정보처리방침'},
nl:{n:'Nederlands',h1:'Eenvoudige, handige apps en games voor Android.',lead:'Kleine tools die je tijd en ruimte besparen, en games voor een paar minuten. Beschikbaar in 10 talen.',apps:'Onze apps',contact:'Contact',c:'Vragen, feedback of ondersteuning',soon:'Binnenkort',priv:'Privacybeleid'},
pt:{n:'Português',h1:'Apps e jogos simples e úteis para Android.',lead:'Pequenas ferramentas que economizam seu tempo e espaço, e jogos para poucos minutos. Disponíveis em 10 idiomas.',apps:'Nossos apps',contact:'Contato',c:'Dúvidas, sugestões ou suporte',soon:'Em breve',priv:'Política de privacidade'}
};
const order=['en','de','tr','es','fr','it','ja','ko','nl','pt'];
let data=null;
function pick(){
  const q=new URLSearchParams(location.search).get('lang'); if(q&&T[q]) return q;
  try{const s=localStorage.getItem('fl-lang'); if(s&&T[s]) return s;}catch(e){}
  const n=(navigator.language||'en').slice(0,2); return T[n]?n:'en';
}
function render(k){
  const x=T[k]; document.documentElement.lang=k;
  h1.textContent=x.h1; lead.textContent=x.lead; hApps.textContent=x.apps; hContact.textContent=x.contact; cText.textContent=x.c;
  if(!data) return;
  apps.innerHTML=data.apps.map(a=>`<div class="app">
    ${a.icon?`<img src="${a.icon}" alt="${a.name}">`:`<div class="ph" style="background:${a.color}">${a.name[0]}</div>`}
    <b>${a.name}</b><p>${a.tagline[k]||a.tagline.en}</p>
    ${a.play?'':`<span class="soon">${x.soon}</span>`}
    <div class="links">${a.play?`<a href="${a.play}">Google Play</a>`:''}${a.privacy?`<a href="${a.privacy}?lang=${k}">${x.priv}</a>`:''}</div></div>`).join('');
}
const sel=document.getElementById('lang');
sel.innerHTML=order.map(k=>`<option value="${k}">${T[k].n}</option>`).join('');
let cur=pick(); sel.value=cur; render(cur);
sel.onchange=()=>{cur=sel.value; try{localStorage.setItem('fl-lang',cur)}catch(e){} render(cur);};
fetch('apps.json').then(r=>r.json()).then(d=>{data=d; render(cur);}).catch(()=>{});
</script>
</body>
</html>
