en:{n:'English',t:'Spaciora – Privacy Policy',d:'Effective date: 22 October 2026',s:[
['Who we are','Spaciora: Phone Cleaner ("Spaciora", "the app") is developed by Flick Labs. This policy explains what information the app uses and how. Contact: '+MAIL],
['Your photos and videos stay on your device','To find duplicates, similar shots, large videos, screenshots and other clutter, Spaciora reads the photos and videos in your gallery. All analysis happens on your device. We never upload, copy, store or share your photos, videos or their contents. Files are deleted only after you select them and confirm in the Android system dialog.'],
['Information we collect','We do not collect personal information. The app has no accounts and no sign-in. Your settings (language, reminder, totals of space freed) are saved only on your device.'],
['Permissions','<ul><li><b>Photos and videos:</b> to scan your gallery and delete the items you choose.</li><li><b>Notifications (optional):</b> to send a weekly cleanup reminder if you turn it on.</li><li><b>Internet:</b> only to load advertising.</li></ul>'],
['Advertising','The app shows ads provided by Google AdMob. To show and measure ads, Google may collect and use information such as your device advertising ID, IP address, device type and approximate location. In the EEA, UK and Switzerland the app asks for your consent before personalized ads are shown, and you can change your choice anytime in Settings → Ad privacy choices. You can also reset or delete your advertising ID in your Android settings. Learn how '+ADMOB+' uses data.'],
['Children','Spaciora is not directed to children under 13 and we do not knowingly collect information from children.'],
['Deleting your data','Because we do not collect your data, there is nothing stored on our side. Uninstalling the app removes all of its settings from your device.'],
['Changes','We may update this policy. The latest version is always available on this page.'],
['Contact','Questions or requests: '+MAIL]]},
tr:{n:'Türkçe',t:'Spaciora – Gizlilik Politikası',d:'Yürürlük tarihi: 22 Ekim 2026',s:[
['Biz kimiz','Spaciora: Telefon Temizleyici ("Spaciora", "uygulama") Flick Labs tarafından geliştirilmiştir. Bu politika, uygulamanın hangi bilgileri nasıl kullandığını açıklar. İletişim: '+MAIL],
['Fotoğraf ve videoların cihazında kalır','Spaciora; aynı ve benzer fotoğrafları, büyük videoları, ekran görüntülerini ve diğer gereksiz dosyaları bulmak için galerindeki fotoğraf ve videoları okur. Tüm analiz cihazında yapılır. Fotoğraflarını, videolarını veya içeriklerini asla yüklemeyiz, kopyalamayız, saklamayız ya da paylaşmayız. Dosyalar yalnızca sen seçip Android sistem penceresinde onayladıktan sonra silinir.'],
['Topladığımız bilgiler','Kişisel bilgi toplamıyoruz. Uygulamada hesap veya giriş yoktur. Ayarların (dil, hatırlatma, açılan alan toplamı) yalnızca cihazında saklanır.'],
['İzinler','<ul><li><b>Fotoğraflar ve videolar:</b> galerini taramak ve seçtiğin öğeleri silmek için.</li><li><b>Bildirimler (isteğe bağlı):</b> açarsan haftalık temizlik hatırlatması göndermek için.</li><li><b>İnternet:</b> yalnızca reklamları yüklemek için.</li></ul>'],
['Reklamlar','Uygulama, Google AdMob tarafından sağlanan reklamlar gösterir. Reklamları göstermek ve ölçmek için Google; cihaz reklam kimliği, IP adresi, cihaz türü ve yaklaşık konum gibi bilgileri toplayıp kullanabilir. AEA, Birleşik Krallık ve İsviçre\'de kişiselleştirilmiş reklamlardan önce onayın istenir; seçimini istediğin zaman Ayarlar → Reklam gizlilik seçenekleri bölümünden değiştirebilirsin. Reklam kimliğini Android ayarlarından sıfırlayabilir veya silebilirsin. '+ADMOB+' verileri nasıl kullanır?'],
['Çocuklar','Spaciora 13 yaşından küçük çocuklara yönelik değildir ve bilerek çocuklardan bilgi toplamayız.'],
['Verilerini silme','Verilerini toplamadığımız için bizim tarafımızda saklanan bir şey yoktur. Uygulamayı kaldırmak tüm ayarlarını cihazından siler.'],
['Değişiklikler','Bu politikayı güncelleyebiliriz. En güncel sürüm her zaman bu sayfadadır.'],
['İletişim','Soru ve talepler için: '+MAIL]]},
de:{n:'Deutsch',t:'Spaciora – Datenschutzerklärung',d:'Gültig ab: 22. Oktober 2026',s:[
['Wer wir sind','Spaciora: Handy Reiniger („Spaciora“, „die App“) wird von Flick Labs entwickelt. Diese Erklärung beschreibt, welche Informationen die App wie nutzt. Kontakt: '+MAIL],
['Deine Fotos und Videos bleiben auf deinem Gerät','Um Duplikate, ähnliche Aufnahmen, große Videos, Screenshots und anderen Ballast zu finden, liest Spaciora die Fotos und Videos in deiner Galerie. Die gesamte Analyse findet auf deinem Gerät statt. Wir laden deine Fotos, Videos oder deren Inhalte niemals hoch, kopieren, speichern oder teilen sie. Dateien werden erst gelöscht, nachdem du sie ausgewählt und im Android-Systemdialog bestätigt hast.'],
['Welche Daten wir erheben','Wir erheben keine personenbezogenen Daten. Die App hat keine Konten und keine Anmeldung. Deine Einstellungen (Sprache, Erinnerung, freigegebener Speicher) werden nur auf deinem Gerät gespeichert.'],
['Berechtigungen','<ul><li><b>Fotos und Videos:</b> um deine Galerie zu scannen und die von dir gewählten Elemente zu löschen.</li><li><b>Benachrichtigungen (optional):</b> für eine wöchentliche Erinnerung, wenn du sie aktivierst.</li><li><b>Internet:</b> nur zum Laden von Werbung.</li></ul>'],
['Werbung','Die App zeigt Anzeigen von Google AdMob. Um Anzeigen auszuliefern und zu messen, kann Google Informationen wie die Werbe-ID deines Geräts, die IP-Adresse, den Gerätetyp und den ungefähren Standort erheben und nutzen. Im EWR, im Vereinigten Königreich und in der Schweiz bittet die App vor personalisierter Werbung um deine Einwilligung; du kannst deine Wahl jederzeit unter Einstellungen → Datenschutzoptionen für Werbung ändern. Die Werbe-ID kannst du in den Android-Einstellungen zurücksetzen oder löschen. So nutzt '+ADMOB+' Daten.'],
['Kinder','Spaciora richtet sich nicht an Kinder unter 13 Jahren, und wir erheben wissentlich keine Daten von Kindern.'],
['Löschen deiner Daten','Da wir keine Daten erheben, wird bei uns nichts gespeichert. Durch Deinstallieren der App werden alle ihre Einstellungen von deinem Gerät entfernt.'],
['Änderungen','Wir können diese Erklärung aktualisieren. Die aktuelle Version findest du immer auf dieser Seite.'],
['Kontakt','Fragen oder Anfragen: '+MAIL]]},
es:{n:'Español',t:'Spaciora – Política de privacidad',d:'Fecha de entrada en vigor: 22 de octubre de 2026',s:[
['Quiénes somos','Spaciora: Limpiador («Spaciora», «la app») está desarrollada por Flick Labs. Esta política explica qué información usa la app y cómo. Contacto: '+MAIL],
['Tus fotos y vídeos se quedan en tu dispositivo','Para encontrar duplicados, fotos similares, vídeos grandes, capturas y otros archivos innecesarios, Spaciora lee las fotos y vídeos de tu galería. Todo el análisis se realiza en tu dispositivo. Nunca subimos, copiamos, almacenamos ni compartimos tus fotos, vídeos ni su contenido. Los archivos solo se eliminan después de que los selecciones y confirmes en el diálogo del sistema Android.'],
['Información que recopilamos','No recopilamos información personal. La app no tiene cuentas ni inicio de sesión. Tus ajustes (idioma, recordatorio, espacio liberado) se guardan solo en tu dispositivo.'],
['Permisos','<ul><li><b>Fotos y vídeos:</b> para analizar tu galería y eliminar los elementos que elijas.</li><li><b>Notificaciones (opcional):</b> para enviarte un recordatorio semanal si lo activas.</li><li><b>Internet:</b> solo para cargar anuncios.</li></ul>'],
['Publicidad','La app muestra anuncios proporcionados por Google AdMob. Para mostrar y medir anuncios, Google puede recopilar y usar información como el ID de publicidad del dispositivo, la dirección IP, el tipo de dispositivo y la ubicación aproximada. En el EEE, Reino Unido y Suiza, la app te pide consentimiento antes de mostrar anuncios personalizados y puedes cambiar tu elección en cualquier momento en Ajustes → Opciones de privacidad de anuncios. También puedes restablecer o eliminar tu ID de publicidad en los ajustes de Android. Cómo usa los datos '+ADMOB+'.'],
['Menores','Spaciora no está dirigida a menores de 13 años y no recopilamos conscientemente información de menores.'],
['Eliminar tus datos','Como no recopilamos tus datos, no guardamos nada en nuestros sistemas. Al desinstalar la app se eliminan todos sus ajustes de tu dispositivo.'],
['Cambios','Podemos actualizar esta política. La versión más reciente está siempre en esta página.'],
['Contacto','Preguntas o solicitudes: '+MAIL]]},
fr:{n:'Français',t:'Spaciora – Politique de confidentialité',d:'Date d’entrée en vigueur : 22 octobre 2026',s:[

['Vos photos et vidéos restent sur votre appareil','Pour trouver les doublons, les photos similaires, les grandes vidéos, les captures d’écran et autres fichiers inutiles, Spaciora lit les photos et vidéos de votre galerie. Toute l’analyse se fait sur votre appareil. Nous n’envoyons, ne copions, ne stockons et ne partageons jamais vos photos, vidéos ou leur contenu. Les fichiers ne sont supprimés qu’après votre sélection et votre confirmation dans la fenêtre système d’Android.'],

['Enfants','Spaciora ne s’adresse pas aux enfants de moins de 13 ans et nous ne collectons pas sciemment d’informations les concernant.'],

it:{n:'Italiano',t:'Spaciora – Informativa sulla privacy',d:'In vigore dal: 22 ottobre 2026',s:[

['Foto e video restano sul tuo dispositivo','Per trovare duplicati, foto simili, video pesanti, screenshot e altri file inutili, Spaciora legge le foto e i video della tua galleria. Tutta l’analisi avviene sul tuo dispositivo. Non carichiamo, copiamo, conserviamo né condividiamo mai le tue foto, i tuoi video o il loro contenuto. I file vengono eliminati solo dopo che li hai selezionati e confermati nella finestra di sistema di Android.'],

ja:{n:'日本語',t:'Spaciora – プライバシーポリシー',d:'施行日：2026年10月22日',s:[
['運営者','Spaciora（以下「本アプリ」）は Flick Labs が開発しています。本ポリシーでは、本アプリが使用する情報とその使い方を説明します。お問い合わせ：'+MAIL],
['写真と動画は端末内にとどまります','重複写真、似た写真、大きな動画、スクリーンショットなどを見つけるため、本アプリはギャラリー内の写真と動画を読み取ります。すべての分析は端末上で行われます。写真や動画、その内容をアップロード、コピー、保存、共有することは一切ありません。ファイルは、あなたが選択し Android のシステムダイアログで確認した後にのみ削除されます。'],
['収集する情報','個人情報は収集しません。アカウントやログインはありません。設定（言語、リマインダー、解放した容量）は端末内にのみ保存されます。'],
['権限','<ul><li><b>写真と動画：</b>ギャラリーをスキャンし、選択した項目を削除するため。</li><li><b>通知（任意）：</b>オンにした場合、毎週の整理リマインダーを送るため。</li><li><b>インターネット：</b>広告の読み込みのみに使用。</li></ul>'],
['広告','本アプリは Google AdMob の広告を表示します。広告の配信と測定のため、Google は広告ID、IPアドレス、端末の種類、おおよその位置情報などを収集・使用する場合があります。EEA、英国、スイスでは、パーソナライズ広告の表示前に同意を求めます。選択は「設定 → 広告のプライバシー設定」でいつでも変更できます。広告IDは Android の設定でリセットまたは削除できます。'+ADMOB+' によるデータの使用について。'],
['お子様','本アプリは13歳未満のお子様を対象としておらず、お子様の情報を意図的に収集することはありません。'],
['データの削除','データを収集していないため、当方には何も保存されていません。アプリをアンインストールすると、すべての設定が端末から削除されます。'],
['変更','本ポリシーは更新されることがあります。最新版は常にこのページで確認できます。'],
['お問い合わせ','ご質問やご要望：'+MAIL]]},
ko:{n:'한국어',t:'Spaciora – 개인정보처리방침',d:'시행일: 2026년 10월 22일',s:[
['운영자','Spaciora(이하 "앱")는 Flick Labs가 개발했습니다. 이 방침은 앱이 어떤 정보를 어떻게 사용하는지 설명합니다. 문의: '+MAIL],
['사진과 동영상은 기기에 남아 있습니다','중복 사진, 비슷한 사진, 큰 동영상, 스크린샷 등을 찾기 위해 앱은 갤러리의 사진과 동영상을 읽습니다. 모든 분석은 기기에서 이루어집니다. 사진, 동영상 또는 그 내용을 업로드, 복사, 저장하거나 공유하지 않습니다. 파일은 사용자가 선택하고 Android 시스템 창에서 확인한 후에만 삭제됩니다.'],
['수집하는 정보','개인정보를 수집하지 않습니다. 계정이나 로그인이 없습니다. 설정(언어, 알림, 확보한 공간)은 기기에만 저장됩니다.'],
['권한','<ul><li><b>사진 및 동영상:</b> 갤러리를 스캔하고 선택한 항목을 삭제하기 위해.</li><li><b>알림(선택):</b> 켜면 매주 정리 알림을 보내기 위해.</li><li><b>인터넷:</b> 광고를 불러오는 데만 사용.</li></ul>'],
['광고','앱은 Google AdMob 광고를 표시합니다. 광고를 게재하고 측정하기 위해 Google은 기기 광고 ID, IP 주소, 기기 유형, 대략적인 위치 등의 정보를 수집하고 사용할 수 있습니다. EEA, 영국, 스위스에서는 맞춤 광고 전에 동의를 요청하며, 설정 → 광고 개인정보 선택에서 언제든지 변경할 수 있습니다. 광고 ID는 Android 설정에서 재설정하거나 삭제할 수 있습니다. '+ADMOB+'의 데이터 사용 방식.'],
['아동','앱은 13세 미만 아동을 대상으로 하지 않으며, 아동의 정보를 고의로 수집하지 않습니다.'],
['데이터 삭제','데이터를 수집하지 않으므로 저희 쪽에 저장된 것이 없습니다. 앱을 삭제하면 모든 설정이 기기에서 제거됩니다.'],
['변경','이 방침은 업데이트될 수 있습니다. 최신 버전은 항상 이 페이지에서 확인할 수 있습니다.'],
['문의','질문 또는 요청: '+MAIL]]},
nl:{n:'Nederlands',t:'Spaciora – Privacybeleid',d:'Ingangsdatum: 22 oktober 2026',s:[
['Wie wij zijn','Spaciora: Telefoon Opschonen ("Spaciora", "de app") is ontwikkeld door Flick Labs. Dit beleid legt uit welke informatie de app gebruikt en hoe. Contact: '+MAIL],
['Je foto’s en video’s blijven op je apparaat','Om duplicaten, vergelijkbare foto’s, grote video’s, screenshots en andere rommel te vinden, leest Spaciora de foto’s en video’s in je galerij. Alle analyse gebeurt op je apparaat. We uploaden, kopiëren, bewaren of delen nooit je foto’s, video’s of hun inhoud. Bestanden worden pas verwijderd nadat je ze hebt geselecteerd en bevestigd in het Android-systeemvenster.'],

const order=['en','de','tr','es','fr','it','ja','ko','nl','pt'];
function pick(){
  const q=new URLSearchParams(location.search).get('lang'); if(q&&L[q]) return q;
  const n=(navigator.language||'en').slice(0,2); return L[n]?n:'en';
}
function show(k){
  const x=L[k]; document.documentElement.lang=k; document.title=x.t;
  document.getElementById('t').textContent=x.t; document.getElementById('d').textContent=x.d;
  document.getElementById('body').innerHTML=x.s.map(([h,p])=>'<h2>'+h+'</h2>'+(p.startsWith('<ul>')?p:'<p>'+p+'</p>')).join('');
  document.querySelectorAll('#langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));
}
document.getElementById('langs').innerHTML=order.map(k=>'<button data-k="'+k+'">'+L[k].n+'</button>').join('');
document.querySelectorAll('#langs button').forEach(b=>b.onclick=()=>show(b.dataset.k));
show(pick());
</script>
