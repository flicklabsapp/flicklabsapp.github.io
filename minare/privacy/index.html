<script>
const MAIL='<a href="mailto:flicklabsapp@gmail.com">flicklabsapp@gmail.com</a>';
const ADMOB='<a href="https://policies.google.com/technologies/partner-sites" target="_blank" rel="noopener">Google</a>';
const L={"en": {"n": "English", "t": "Minare – Privacy Policy", "d": "Effective date: 22 October 2026", "s": [["Who we are", "Minare (\"the app\") is developed by Flick Labs. It shows prayer times, the Qibla direction, a dhikr counter and supplications. This policy explains what information the app uses and how. Contact: "+MAIL+""], ["Location", "To calculate prayer times and the Qibla direction for where you are, the app asks for your location while you are using it. It never uses location in the background. Your coordinates are used on your device and saved only on your device. To show the name of your city, the app uses your phone’s built-in geocoding service, which on Android may be provided by Google. We do not receive or store your location."], ["Compass sensors", "The Qibla compass uses your phone’s motion and compass sensors. These readings are used only on your device, in real time, and are not saved or shared."], ["Notifications (optional)", "If you turn on prayer time reminders, the app schedules them locally on your device. No notification data is sent to us."], ["Information we collect", "We do not collect personal information. The app has no accounts and no sign-in. Your settings (language, calculation method, reminders, dhikr counts) are saved only on your device."], ["Advertising", "The app may show ads provided by Google AdMob. To show and measure ads, Google may collect information such as your device advertising ID, IP address, device type and approximate location. In the EEA, UK and Switzerland the app asks for your consent before personalized ads are shown. You can reset or delete your advertising ID in your Android settings. Learn how "+ADMOB+" uses data."], ["Children", "Minare is suitable for a general audience and is not directed to children under 13. We do not knowingly collect personal information from children."], ["Deleting your data", "Because we do not collect your data, nothing is stored on our side. Uninstalling the app removes all of its data from your device. You can also turn off location access anytime in your Android settings."], ["Changes", "We may update this policy. The latest version is always available on this page."], ["Contact", "Questions or requests: "+MAIL+""]]}, "de": {"n": "Deutsch", "t": "Minare – Datenschutzerklärung", "d": "Gültig ab: 22. Oktober 2026", "s": [["Wer wir sind", "Minare („die App“) wird von Flick Labs entwickelt. Sie zeigt Gebetszeiten, die Qibla-Richtung, einen Dhikr-Zähler und Bittgebete. Diese Erklärung beschreibt, welche Informationen die App wie nutzt. Kontakt: "+MAIL+""], ["Standort", "Um Gebetszeiten und die Qibla-Richtung für deinen Ort zu berechnen, fragt die App während der Nutzung nach deinem Standort. Sie nutzt den Standort nie im Hintergrund. Deine Koordinaten werden auf deinem Gerät verwendet und nur dort gespeichert. Um den Namen deiner Stadt anzuzeigen, nutzt die App den integrierten Geokodierungsdienst deines Telefons, der unter Android von Google bereitgestellt werden kann. Wir erhalten oder speichern deinen Standort nicht."], ["Kompass-Sensoren", "Der Qibla-Kompass nutzt die Bewegungs- und Kompasssensoren deines Telefons. Diese Werte werden nur in Echtzeit auf deinem Gerät verwendet und weder gespeichert noch geteilt."], ["Benachrichtigungen (optional)", "Wenn du Erinnerungen an Gebetszeiten aktivierst, plant die App sie lokal auf deinem Gerät. Es werden keine Benachrichtigungsdaten an uns gesendet."], ["Welche Daten wir erheben", "Wir erheben keine personenbezogenen Daten. Die App hat keine Konten und keine Anmeldung. Deine Einstellungen (Sprache, Berechnungsmethode, Erinnerungen, Dhikr-Zähler) werden nur auf deinem Gerät gespeichert."], ["Werbung", "Die App kann Anzeigen von Google AdMob zeigen. Um Anzeigen auszuliefern und zu messen, kann Google Informationen wie die Werbe-ID deines Geräts, die IP-Adresse, den Gerätetyp und den ungefähren Standort erheben. Im EWR, im Vereinigten Königreich und in der Schweiz bittet die App vor personalisierter Werbung um deine Einwilligung. Die Werbe-ID kannst du in den Android-Einstellungen zurücksetzen oder löschen. So nutzt "+ADMOB+" Daten."], ["Kinder", "Minare ist für alle Altersgruppen geeignet und richtet sich nicht an Kinder unter 13 Jahren. Wir erheben wissentlich keine Daten von Kindern."], ["Löschen deiner Daten", "Da wir keine Daten erheben, wird bei uns nichts gespeichert. Durch Deinstallieren der App werden alle ihre Daten von deinem Gerät entfernt. Den Standortzugriff kannst du jederzeit in den Android-Einstellungen deaktivieren."], ["Änderungen", "Wir können diese Erklärung aktualisieren. Die aktuelle Version findest du immer auf dieser Seite."], ["Kontakt", "Fragen oder Anfragen: "+MAIL+""]]}, "tr": {"n": "Türkçe", "t": "Minare – Gizlilik Politikası", "d": "Yürürlük tarihi: 22 Ekim 2026", "s": [["Biz kimiz", "Minare (\"uygulama\") Flick Labs tarafından geliştirilmiştir. Namaz vakitlerini, kıble yönünü, zikirmatiği ve duaları gösterir. Bu politika, uygulamanın hangi bilgileri nasıl kullandığını açıklar. İletişim: "+MAIL+""], ["Konum", "Bulunduğun yere göre namaz vakitlerini ve kıble yönünü hesaplamak için uygulama, kullanırken konumunu ister. Konumu asla arka planda kullanmaz. Koordinatların cihazında kullanılır ve yalnızca cihazında saklanır. Şehrinin adını göstermek için uygulama, telefonunun yerleşik konum adı servisini kullanır; Android'de bu servis Google tarafından sağlanabilir. Konumunu biz almayız ve saklamayız."], ["Pusula sensörleri", "Kıble pusulası, telefonunun hareket ve pusula sensörlerini kullanır. Bu ölçümler yalnızca cihazında, anlık olarak kullanılır; kaydedilmez ve paylaşılmaz."], ["Bildirimler (isteğe bağlı)", "Namaz vakti hatırlatmalarını açarsan uygulama bunları cihazında yerel olarak planlar. Bize hiçbir bildirim verisi gönderilmez."], ["Topladığımız bilgiler", "Kişisel bilgi toplamıyoruz. Uygulamada hesap veya giriş yoktur. Ayarların (dil, hesaplama yöntemi, hatırlatmalar, zikir sayıları) yalnızca cihazında saklanır."], ["Reklamlar", "Uygulama, Google AdMob tarafından sağlanan reklamlar gösterebilir. Reklamları göstermek ve ölçmek için Google; cihaz reklam kimliği, IP adresi, cihaz türü ve yaklaşık konum gibi bilgileri toplayabilir. AEA, Birleşik Krallık ve İsviçre'de kişiselleştirilmiş reklamlardan önce onayın istenir. Reklam kimliğini Android ayarlarından sıfırlayabilir veya silebilirsin. "+ADMOB+" verileri nasıl kullanır?"], ["Çocuklar", "Minare genel kitleye uygundur ve 13 yaşından küçük çocuklara yönelik değildir. Bilerek çocuklardan kişisel bilgi toplamayız."], ["Verilerini silme", "Verilerini toplamadığımız için bizim tarafımızda saklanan bir şey yoktur. Uygulamayı kaldırmak tüm verilerini cihazından siler. Konum iznini istediğin zaman Android ayarlarından kapatabilirsin."], ["Değişiklikler", "Bu politikayı güncelleyebiliriz. En güncel sürüm her zaman bu sayfadadır."], ["İletişim", "Soru ve talepler için: "+MAIL+""]]}, "es": {"n": "Español", "t": "Minare – Política de privacidad", "d": "Fecha de entrada en vigor: 22 de octubre de 2026", "s": [["Quiénes somos", "Minare («la app») está desarrollada por Flick Labs. Muestra los horarios de oración, la dirección de la Qibla, un contador de dhikr y súplicas. Esta política explica qué información usa la app y cómo. Contacto: "+MAIL+""], ["Ubicación", "Para calcular los horarios de oración y la dirección de la Qibla según dónde estés, la app solicita tu ubicación mientras la usas. Nunca usa la ubicación en segundo plano. Tus coordenadas se usan en tu dispositivo y se guardan solo en él. Para mostrar el nombre de tu ciudad, la app usa el servicio de geocodificación integrado del teléfono, que en Android puede proporcionar Google. No recibimos ni guardamos tu ubicación."], ["Sensores de brújula", "La brújula de la Qibla usa los sensores de movimiento y brújula del teléfono. Estas lecturas se usan solo en tu dispositivo, en tiempo real, y no se guardan ni se comparten."], ["Notificaciones (opcional)", "Si activas los recordatorios de oración, la app los programa localmente en tu dispositivo. No se nos envía ningún dato de notificaciones."], ["Información que recopilamos", "No recopilamos información personal. La app no tiene cuentas ni inicio de sesión. Tus ajustes (idioma, método de cálculo, recordatorios, contadores de dhikr) se guardan solo en tu dispositivo."], ["Publicidad", "La app puede mostrar anuncios proporcionados por Google AdMob. Para mostrar y medir anuncios, Google puede recopilar información como el ID de publicidad del dispositivo, la dirección IP, el tipo de dispositivo y la ubicación aproximada. En el EEE, Reino Unido y Suiza, la app te pide consentimiento antes de mostrar anuncios personalizados. Puedes restablecer o eliminar tu ID de publicidad en los ajustes de Android. Cómo usa los datos "+ADMOB+"."], ["Menores", "Minare es apta para todos los públicos y no está dirigida a menores de 13 años. No recopilamos conscientemente información de menores."], ["Eliminar tus datos", "Como no recopilamos tus datos, no guardamos nada en nuestros sistemas. Al desinstalar la app se eliminan todos sus datos de tu dispositivo. También puedes desactivar el acceso a la ubicación en cualquier momento en los ajustes de Android."], ["Cambios", "Podemos actualizar esta política. La versión más reciente está siempre en esta página."], ["Contacto", "Preguntas o solicitudes: "+MAIL+""]]}, "fr": {"n": "Français", "t": "Minare – Politique de confidentialité", "d": "Date d’entrée en vigueur : 22 octobre 2026", "s": [["Qui sommes-nous", "Minare (« l’application ») est développée par Flick Labs. Elle affiche les heures de prière, la direction de la Qibla, un compteur de dhikr et des invocations. Cette politique explique quelles informations l’application utilise et comment. Contact : "+MAIL+""], ["Localisation", "Pour calculer les heures de prière et la direction de la Qibla selon l’endroit où vous êtes, l’application demande votre position pendant que vous l’utilisez. Elle n’utilise jamais la localisation en arrière-plan. Vos coordonnées sont utilisées et enregistrées uniquement sur votre appareil. Pour afficher le nom de votre ville, l’application utilise le service de géocodage intégré du téléphone, qui peut être fourni par Google sur Android. Nous ne recevons ni ne conservons votre position."], ["Capteurs de boussole", "La boussole de la Qibla utilise les capteurs de mouvement et de boussole du téléphone. Ces mesures sont utilisées uniquement sur votre appareil, en temps réel, et ne sont ni enregistrées ni partagées."], ["Notifications (facultatif)", "Si vous activez les rappels de prière, l’application les programme localement sur votre appareil. Aucune donnée de notification ne nous est envoyée."], ["Informations collectées", "Nous ne collectons aucune information personnelle. L’application n’a ni compte ni connexion. Vos réglages (langue, méthode de calcul, rappels, compteurs de dhikr) sont enregistrés uniquement sur votre appareil."], ["Publicité", "L’application peut afficher des annonces fournies par Google AdMob. Pour diffuser et mesurer les annonces, Google peut collecter des informations telles que l’identifiant publicitaire de l’appareil, l’adresse IP, le type d’appareil et la localisation approximative. Dans l’EEE, au Royaume-Uni et en Suisse, l’application demande votre consentement avant d’afficher des annonces personnalisées. Vous pouvez réinitialiser ou supprimer votre identifiant publicitaire dans les paramètres Android. Comment "+ADMOB+" utilise les données."], ["Enfants", "Minare convient à un public général et ne s’adresse pas aux enfants de moins de 13 ans. Nous ne collectons pas sciemment d’informations concernant des enfants."], ["Suppression de vos données", "Comme nous ne collectons pas vos données, rien n’est conservé de notre côté. La désinstallation de l’application supprime toutes ses données de votre appareil. Vous pouvez aussi désactiver l’accès à la localisation à tout moment dans les paramètres Android."], ["Modifications", "Nous pouvons mettre à jour cette politique. La dernière version est toujours disponible sur cette page."], ["Contact", "Questions ou demandes : "+MAIL+""]]}, "it": {"n": "Italiano", "t": "Minare – Informativa sulla privacy", "d": "In vigore dal: 22 ottobre 2026", "s": [["Chi siamo", "Minare (\"l’app\") è sviluppata da Flick Labs. Mostra gli orari di preghiera, la direzione della Qibla, un contatore di dhikr e invocazioni. Questa informativa spiega quali informazioni utilizza l’app e come. Contatti: "+MAIL+""], ["Posizione", "Per calcolare gli orari di preghiera e la direzione della Qibla in base a dove ti trovi, l’app chiede la tua posizione mentre la usi. Non usa mai la posizione in background. Le tue coordinate sono usate e salvate solo sul tuo dispositivo. Per mostrare il nome della tua città, l’app usa il servizio di geocodifica integrato nel telefono, che su Android può essere fornito da Google. Non riceviamo né conserviamo la tua posizione."], ["Sensori della bussola", "La bussola della Qibla usa i sensori di movimento e bussola del telefono. Questi dati sono usati solo sul dispositivo, in tempo reale, e non vengono salvati né condivisi."], ["Notifiche (facoltative)", "Se attivi i promemoria per gli orari di preghiera, l’app li programma localmente sul dispositivo. Nessun dato delle notifiche ci viene inviato."], ["Informazioni raccolte", "Non raccogliamo informazioni personali. L’app non ha account né accesso. Le tue impostazioni (lingua, metodo di calcolo, promemoria, conteggi di dhikr) sono salvate solo sul tuo dispositivo."], ["Pubblicità", "L’app può mostrare annunci forniti da Google AdMob. Per mostrare e misurare gli annunci, Google può raccogliere informazioni come l’ID pubblicitario del dispositivo, l’indirizzo IP, il tipo di dispositivo e la posizione approssimativa. Nel SEE, nel Regno Unito e in Svizzera l’app chiede il tuo consenso prima di mostrare annunci personalizzati. Puoi reimpostare o eliminare l’ID pubblicitario nelle impostazioni di Android. Come "+ADMOB+" utilizza i dati."], ["Minori", "Minare è adatta a tutti e non è rivolta a minori di 13 anni. Non raccogliamo consapevolmente informazioni sui minori."], ["Eliminazione dei dati", "Poiché non raccogliamo i tuoi dati, non conserviamo nulla. Disinstallando l’app vengono rimossi tutti i suoi dati dal dispositivo. Puoi anche disattivare l’accesso alla posizione in qualsiasi momento nelle impostazioni di Android."], ["Modifiche", "Possiamo aggiornare questa informativa. La versione più recente è sempre disponibile su questa pagina."], ["Contatti", "Domande o richieste: "+MAIL+""]]}, "ja": {"n": "日本語", "t": "Minare – プライバシーポリシー", "d": "施行日：2026年10月22日", "s": [["運営者", "Minare（以下「本アプリ」）は Flick Labs が開発しています。礼拝時刻、キブラの方角、ズィクルカウンター、祈りの言葉を表示します。本ポリシーでは、本アプリが使用する情報とその使い方を説明します。お問い合わせ："+MAIL+""], ["位置情報", "現在地に合わせて礼拝時刻とキブラの方角を計算するため、アプリの使用中に位置情報の許可を求めます。バックグラウンドで位置情報を使用することはありません。座標は端末上で使用され、端末内にのみ保存されます。都市名を表示するために端末内蔵のジオコーディングサービスを使用します（Android では Google が提供する場合があります）。当方が位置情報を受け取ったり保存したりすることはありません。"], ["コンパスセンサー", "キブラコンパスは端末のモーションセンサーとコンパスセンサーを使用します。これらの値は端末上でリアルタイムにのみ使用され、保存や共有はされません。"], ["通知（任意）", "礼拝時刻のリマインダーをオンにすると、アプリが端末内でローカルに予約します。通知に関するデータが当方に送信されることはありません。"], ["収集する情報", "個人情報は収集しません。アカウントやログインはありません。設定（言語、計算方法、リマインダー、ズィクルの回数）は端末内にのみ保存されます。"], ["広告", "本アプリは Google AdMob の広告を表示する場合があります。広告の配信と測定のため、Google は広告ID、IPアドレス、端末の種類、おおよその位置情報などを収集する場合があります。EEA、英国、スイスでは、パーソナライズ広告の表示前に同意を求めます。広告IDは Android の設定でリセットまたは削除できます。"+ADMOB+" によるデータの使用について。"], ["お子様", "本アプリは一般向けであり、13歳未満のお子様を対象としていません。お子様の個人情報を意図的に収集することはありません。"], ["データの削除", "データを収集していないため、当方には何も保存されていません。アプリをアンインストールすると、すべてのデータが端末から削除されます。位置情報へのアクセスは Android の設定でいつでもオフにできます。"], ["変更", "本ポリシーは更新されることがあります。最新版は常にこのページで確認できます。"], ["お問い合わせ", "ご質問やご要望："+MAIL+""]]}, "ko": {"n": "한국어", "t": "Minare – 개인정보처리방침", "d": "시행일: 2026년 10월 22일", "s": [["운영자", "Minare(이하 \"앱\")는 Flick Labs가 개발했습니다. 기도 시간, 키블라 방향, 디크르 카운터, 기도문을 보여 줍니다. 이 방침은 앱이 어떤 정보를 어떻게 사용하는지 설명합니다. 문의: "+MAIL+""], ["위치", "현재 위치에 맞는 기도 시간과 키블라 방향을 계산하기 위해 앱을 사용하는 동안 위치 권한을 요청합니다. 백그라운드에서는 위치를 사용하지 않습니다. 좌표는 기기에서만 사용되고 기기에만 저장됩니다. 도시 이름을 표시하기 위해 휴대폰에 내장된 지오코딩 서비스를 사용하며, Android에서는 Google이 제공할 수 있습니다. 저희는 위치를 받거나 저장하지 않습니다."], ["나침반 센서", "키블라 나침반은 휴대폰의 동작 및 나침반 센서를 사용합니다. 이 값은 기기에서 실시간으로만 사용되며 저장되거나 공유되지 않습니다."], ["알림(선택)", "기도 시간 알림을 켜면 앱이 기기에서 로컬로 예약합니다. 알림 데이터는 저희에게 전송되지 않습니다."], ["수집하는 정보", "개인정보를 수집하지 않습니다. 계정이나 로그인이 없습니다. 설정(언어, 계산 방법, 알림, 디크르 횟수)은 기기에만 저장됩니다."], ["광고", "앱은 Google AdMob 광고를 표시할 수 있습니다. 광고를 게재하고 측정하기 위해 Google은 기기 광고 ID, IP 주소, 기기 유형, 대략적인 위치 등의 정보를 수집할 수 있습니다. EEA, 영국, 스위스에서는 맞춤 광고 전에 동의를 요청합니다. 광고 ID는 Android 설정에서 재설정하거나 삭제할 수 있습니다. "+ADMOB+"의 데이터 사용 방식."], ["아동", "Minare는 전체 이용가이며 13세 미만 아동을 대상으로 하지 않습니다. 아동의 개인정보를 고의로 수집하지 않습니다."], ["데이터 삭제", "데이터를 수집하지 않으므로 저희 쪽에 저장된 것이 없습니다. 앱을 삭제하면 모든 데이터가 기기에서 제거됩니다. 위치 접근 권한은 Android 설정에서 언제든지 끌 수 있습니다."], ["변경", "이 방침은 업데이트될 수 있습니다. 최신 버전은 항상 이 페이지에서 확인할 수 있습니다."], ["문의", "질문 또는 요청: "+MAIL+""]]}, "nl": {"n": "Nederlands", "t": "Minare – Privacybeleid", "d": "Ingangsdatum: 22 oktober 2026", "s": [["Wie wij zijn", "Minare (\"de app\") is ontwikkeld door Flick Labs. De app toont gebedstijden, de Qibla-richting, een dhikr-teller en smeekbeden. Dit beleid legt uit welke informatie de app gebruikt en hoe. Contact: "+MAIL+""], ["Locatie", "Om gebedstijden en de Qibla-richting voor jouw plek te berekenen, vraagt de app tijdens het gebruik om je locatie. De app gebruikt je locatie nooit op de achtergrond. Je coördinaten worden alleen op je apparaat gebruikt en opgeslagen. Om de naam van je stad te tonen gebruikt de app de ingebouwde geocodeerdienst van je telefoon, die op Android door Google geleverd kan worden. Wij ontvangen of bewaren je locatie niet."], ["Kompassensoren", "Het Qibla-kompas gebruikt de bewegings- en kompassensoren van je telefoon. Deze metingen worden alleen in realtime op je apparaat gebruikt en niet opgeslagen of gedeeld."], ["Meldingen (optioneel)", "Als je herinneringen voor gebedstijden inschakelt, plant de app ze lokaal op je apparaat. Er worden geen meldingsgegevens naar ons gestuurd."], ["Welke gegevens we verzamelen", "We verzamelen geen persoonsgegevens. De app heeft geen accounts en geen aanmelding. Je instellingen (taal, berekeningsmethode, herinneringen, dhikr-tellingen) worden alleen op je apparaat opgeslagen."], ["Advertenties", "De app kan advertenties van Google AdMob tonen. Om advertenties te tonen en te meten kan Google informatie verzamelen, zoals de advertentie-ID van je apparaat, IP-adres, apparaattype en geschatte locatie. In de EER, het VK en Zwitserland vraagt de app om toestemming voordat gepersonaliseerde advertenties worden getoond. Je advertentie-ID kun je resetten of verwijderen in de Android-instellingen. Hoe "+ADMOB+" gegevens gebruikt."], ["Kinderen", "Minare is geschikt voor alle leeftijden en niet bedoeld voor kinderen jonger dan 13 jaar. We verzamelen niet bewust gegevens van kinderen."], ["Je gegevens verwijderen", "Omdat we je gegevens niet verzamelen, bewaren wij niets. Als je de app verwijdert, worden al haar gegevens van je apparaat verwijderd. Je kunt locatietoegang ook altijd uitschakelen in de Android-instellingen."], ["Wijzigingen", "We kunnen dit beleid bijwerken. De nieuwste versie staat altijd op deze pagina."], ["Contact", "Vragen of verzoeken: "+MAIL+""]]}, "pt": {"n": "Português", "t": "Minare – Política de Privacidade", "d": "Data de vigência: 22 de outubro de 2026", "s": [["Quem somos", "Minare (\"o app\") é desenvolvido pela Flick Labs. Ele mostra os horários de oração, a direção da Qibla, um contador de dhikr e súplicas. Esta política explica quais informações o app usa e como. Contato: "+MAIL+""], ["Localização", "Para calcular os horários de oração e a direção da Qibla de onde você está, o app pede sua localização enquanto você o usa. Ele nunca usa a localização em segundo plano. Suas coordenadas são usadas e salvas apenas no seu aparelho. Para mostrar o nome da sua cidade, o app usa o serviço de geocodificação integrado do celular, que no Android pode ser fornecido pelo Google. Não recebemos nem armazenamos sua localização."], ["Sensores da bússola", "A bússola da Qibla usa os sensores de movimento e bússola do celular. Essas leituras são usadas apenas no seu aparelho, em tempo real, e não são salvas nem compartilhadas."], ["Notificações (opcional)", "Se você ativar os lembretes de oração, o app os agenda localmente no seu aparelho. Nenhum dado de notificação é enviado para nós."], ["Informações que coletamos", "Não coletamos informações pessoais. O app não tem contas nem login. Suas configurações (idioma, método de cálculo, lembretes, contagens de dhikr) ficam salvas apenas no seu aparelho."], ["Publicidade", "O app pode exibir anúncios fornecidos pelo Google AdMob. Para exibir e medir anúncios, o Google pode coletar informações como o ID de publicidade do aparelho, endereço IP, tipo de aparelho e localização aproximada. No EEE, Reino Unido e Suíça, o app pede seu consentimento antes de exibir anúncios personalizados. Você pode redefinir ou excluir seu ID de publicidade nas configurações do Android. Como o "+ADMOB+" usa os dados."], ["Crianças", "O Minare é adequado para todos os públicos e não é direcionado a crianças menores de 13 anos. Não coletamos intencionalmente informações de crianças."], ["Excluir seus dados", "Como não coletamos seus dados, nada fica armazenado do nosso lado. Desinstalar o app remove todos os dados do seu aparelho. Você também pode desativar o acesso à localização a qualquer momento nas configurações do Android."], ["Alterações", "Podemos atualizar esta política. A versão mais recente está sempre nesta página."], ["Contato", "Dúvidas ou solicitações: "+MAIL+""]]}};
const order=['en','de','tr','es','fr','it','ja','ko','nl','pt'];
function pick(){
  const q=new URLSearchParams(location.search).get('lang'); if(q&&L[q]) return q;
  const n=(navigator.language||'en').slice(0,2); return L[n]?n:'en';
}
function show(k){
  const x=L[k]; document.documentElement.lang=k; document.title=x.t;
  document.getElementById('t').textContent=x.t; document.getElementById('d').textContent=x.d;
  document.getElementById('body').innerHTML=x.s.map(([h,p])=>'<h2>'+h+'</h2>'+(p.startsWith('<ul>')?p:'<p>'+p+'</p>')).join('');
  document.querySelectorAll('#langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));
}
document.getElementById('langs').innerHTML=order.map(k=>'<button data-k="'+k+'">'+L[k].n+'</button>').join('');
document.querySelectorAll('#langs button').forEach(b=>b.onclick=()=>show(b.dataset.k));
show(pick());
</script>
