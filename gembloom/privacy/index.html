<script>
const MAIL='<a href="mailto:flicklabsapp@gmail.com">flicklabsapp@gmail.com</a>';
const ADMOB='<a href="https://policies.google.com/technologies/partner-sites" target="_blank" rel="noopener">Google</a>';
const L={"en": {"n": "English", "t": "Gem Bloom – Privacy Policy", "d": "Effective date: 22 October 2026", "s": [["Who we are", "Gem Bloom (\"the game\") is developed by Flick Labs. This policy explains what information the game collects, why, and the choices you have. Contact: "+MAIL+""], ["If you play as a guest", "Your progress, stars, boosters and settings are stored only on your device. We do not receive them."], ["If you sign in with Google", "We receive a unique account ID from Google sign-in. We do not store your email address, password or contacts. You choose a nickname, which is shown publicly on leaderboards. For signed-in players we store the nickname, level progress, stars, scores and weekly challenge results so you can keep your progress across devices and appear on leaderboards."], ["How we use information", "<ul><li>To save and sync your progress.</li><li>To run leaderboards and the weekly challenge, which show your nickname, rank frame and score to other players.</li><li>To give you the reward after a rewarded ad.</li><li>To prevent cheating and keep nicknames free of offensive words.</li><li>To fix problems and improve the game using anonymous crash reports.</li></ul>We do not sell your personal information."], ["Advertising", "The game shows ads from Google AdMob, including optional rewarded ads (for example \"watch an ad for +5 moves\"). To show and measure ads, Google may collect your device advertising ID, IP address, device type and approximate location. In the EEA, UK and Switzerland the game asks for your consent before personalized ads are shown. You can reset or delete your advertising ID in your Android settings. Learn how "+ADMOB+" uses data."], ["Services we use", "Google Sign-In and Google Firebase (account and database) and Google AdMob (ads), all operated by Google: <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\">policies.google.com/privacy</a>"], ["Deleting your account and data", "Open the game and go to Settings → Delete account and data. This permanently deletes your account, nickname, progress and scores from our servers within 30 days. Guests can use Delete my progress to erase the data on their device. You can also request deletion by email, even if the game is no longer installed: "+MAIL+""], ["Retention and security", "We keep game data while your account exists. Data is stored on Google Firebase servers, protected with encryption in transit and access controls."], ["Children", "Gem Bloom is a general-audience game and is not directed at children under 13. We do not knowingly collect personal information from children under 13. If you believe a child has given us personal information, contact us and we will delete it."], ["Changes", "If we change this policy, we will update the date above and, for important changes, tell you in the game."], ["Contact", "Questions or deletion requests: "+MAIL+""]]}, "de": {"n": "Deutsch", "t": "Gem Bloom – Datenschutzerklärung", "d": "Gültig ab: 22. Oktober 2026", "s": [["Wer wir sind", "Gem Bloom („das Spiel“) wird von Flick Labs entwickelt. Diese Erklärung beschreibt, welche Informationen das Spiel erhebt, warum, und welche Wahlmöglichkeiten du hast. Kontakt: "+MAIL+""], ["Wenn du als Gast spielst", "Dein Fortschritt, deine Sterne, Booster und Einstellungen werden nur auf deinem Gerät gespeichert. Wir erhalten sie nicht."], ["Wenn du dich mit Google anmeldest", "Wir erhalten eine eindeutige Konto-ID von der Google-Anmeldung. Deine E-Mail-Adresse, dein Passwort oder deine Kontakte speichern wir nicht. Du wählst einen Spitznamen, der öffentlich in Bestenlisten angezeigt wird. Für angemeldete Spieler speichern wir Spitzname, Levelfortschritt, Sterne, Punkte und Ergebnisse der Wochen-Challenge, damit dein Fortschritt geräteübergreifend erhalten bleibt und du in den Bestenlisten erscheinst."], ["Wie wir Informationen nutzen", "<ul><li>Um deinen Fortschritt zu speichern und zu synchronisieren.</li><li>Für Bestenlisten und die Wochen-Challenge, die anderen Spielern deinen Spitznamen, Rangrahmen und Punktestand zeigen.</li><li>Um dir nach einer Werbung mit Belohnung die Belohnung zu geben.</li><li>Um Betrug zu verhindern und Spitznamen frei von beleidigenden Wörtern zu halten.</li><li>Um mit anonymen Absturzberichten Fehler zu beheben und das Spiel zu verbessern.</li></ul>Wir verkaufen deine personenbezogenen Daten nicht."], ["Werbung", "Das Spiel zeigt Anzeigen von Google AdMob, darunter optionale Werbung mit Belohnung (z. B. „Werbung ansehen für +5 Züge“). Um Anzeigen auszuliefern und zu messen, kann Google die Werbe-ID deines Geräts, die IP-Adresse, den Gerätetyp und den ungefähren Standort erheben. Im EWR, im Vereinigten Königreich und in der Schweiz bittet das Spiel vor personalisierter Werbung um deine Einwilligung. Die Werbe-ID kannst du in den Android-Einstellungen zurücksetzen oder löschen. So nutzt "+ADMOB+" Daten."], ["Genutzte Dienste", "Google-Anmeldung und Google Firebase (Konto und Datenbank) sowie Google AdMob (Werbung), alle betrieben von Google: <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\">policies.google.com/privacy</a>"], ["Konto und Daten löschen", "Öffne das Spiel und gehe zu Einstellungen → Konto und Daten löschen. Dadurch werden dein Konto, Spitzname, Fortschritt und Punkte innerhalb von 30 Tagen dauerhaft von unseren Servern gelöscht. Gäste können mit „Meinen Fortschritt löschen“ die Daten auf ihrem Gerät entfernen. Du kannst die Löschung auch per E-Mail beantragen, selbst wenn das Spiel nicht mehr installiert ist: "+MAIL+""], ["Speicherdauer und Sicherheit", "Wir speichern Spieldaten, solange dein Konto besteht. Die Daten liegen auf Servern von Google Firebase und sind durch Verschlüsselung bei der Übertragung und Zugriffskontrollen geschützt."], ["Kinder", "Gem Bloom ist ein Spiel für alle Altersgruppen und richtet sich nicht an Kinder unter 13 Jahren. Wir erheben wissentlich keine personenbezogenen Daten von Kindern unter 13 Jahren. Wenn du glaubst, dass ein Kind uns Daten übermittelt hat, kontaktiere uns und wir löschen sie."], ["Änderungen", "Wenn wir diese Erklärung ändern, aktualisieren wir das Datum oben und informieren dich bei wichtigen Änderungen im Spiel."], ["Kontakt", "Fragen oder Löschanfragen: "+MAIL+""]]}, "tr": {"n": "Türkçe", "t": "Gem Bloom – Gizlilik Politikası", "d": "Yürürlük tarihi: 22 Ekim 2026", "s": [["Biz kimiz", "Gem Bloom (\"oyun\") Flick Labs tarafından geliştirilmiştir. Bu politika, oyunun hangi bilgileri neden topladığını ve hangi seçeneklere sahip olduğunu açıklar. İletişim: "+MAIL+""], ["Misafir olarak oynarsan", "İlerlemen, yıldızların, güçlendiricilerin ve ayarların yalnızca cihazında saklanır. Bu bilgiler bize ulaşmaz."], ["Google ile giriş yaparsan", "Google girişinden benzersiz bir hesap kimliği alırız. E-posta adresini, şifreni veya rehberini saklamayız. Seçtiğin takma ad lider tablolarında herkese açık görünür. Giriş yapan oyuncular için takma ad, seviye ilerlemesi, yıldızlar, puanlar ve haftalık meydan okuma sonuçlarını saklarız; böylece ilerlemen cihazlar arasında korunur ve lider tablolarında yer alırsın."], ["Bilgileri nasıl kullanırız", "<ul><li>İlerlemeni kaydetmek ve eşitlemek için.</li><li>Takma adını, rütbe çerçeveni ve puanını diğer oyunculara gösteren lider tablolarını ve haftalık meydan okumayı yürütmek için.</li><li>Ödüllü reklamdan sonra ödülünü vermek için.</li><li>Hileyi önlemek ve takma adları uygunsuz kelimelerden korumak için.</li><li>Anonim hata raporlarıyla sorunları gidermek ve oyunu geliştirmek için.</li></ul>Kişisel bilgilerini satmayız."], ["Reklamlar", "Oyun, isteğe bağlı ödüllü reklamlar dahil Google AdMob reklamları gösterir (örneğin \"+5 hamle için reklam izle\"). Reklamları göstermek ve ölçmek için Google; cihaz reklam kimliği, IP adresi, cihaz türü ve yaklaşık konum gibi bilgileri toplayabilir. AEA, Birleşik Krallık ve İsviçre'de kişiselleştirilmiş reklamlardan önce onayın istenir. Reklam kimliğini Android ayarlarından sıfırlayabilir veya silebilirsin. "+ADMOB+" verileri nasıl kullanır?"], ["Kullandığımız hizmetler", "Google ile Giriş ve Google Firebase (hesap ve veritabanı) ile Google AdMob (reklamlar); hepsi Google tarafından işletilir: <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\">policies.google.com/privacy</a>"], ["Hesabını ve verilerini silme", "Oyunda Ayarlar → Hesabı ve verileri sil bölümüne git. Bu işlem hesabını, takma adını, ilerlemeni ve puanlarını 30 gün içinde sunucularımızdan kalıcı olarak siler. Misafir oyuncular cihazdaki verileri silmek için İlerlememi sil seçeneğini kullanabilir. Oyun yüklü olmasa bile e-postayla silme talebinde bulunabilirsin: "+MAIL+""], ["Saklama ve güvenlik", "Oyun verilerini hesabın var olduğu sürece saklarız. Veriler Google Firebase sunucularında, aktarım sırasında şifreleme ve erişim kontrolleriyle korunur."], ["Çocuklar", "Gem Bloom genel kitleye yönelik bir oyundur ve 13 yaşından küçük çocuklara yönelik değildir. Bilerek 13 yaş altı çocuklardan kişisel bilgi toplamayız. Bir çocuğun bize kişisel bilgi verdiğini düşünüyorsan bize yaz, silelim."], ["Değişiklikler", "Bu politikayı değiştirirsek yukarıdaki tarihi güncelleriz; önemli değişiklikleri oyunda da bildiririz."], ["İletişim", "Soru ve silme talepleri için: "+MAIL+""]]}, "es": {"n": "Español", "t": "Gem Bloom – Política de privacidad", "d": "Fecha de entrada en vigor: 22 de octubre de 2026", "s": [["Quiénes somos", "Gem Bloom («el juego») está desarrollado por Flick Labs. Esta política explica qué información recopila el juego, por qué y qué opciones tienes. Contacto: "+MAIL+""], ["Si juegas como invitado", "Tu progreso, estrellas, potenciadores y ajustes se guardan solo en tu dispositivo. Nosotros no los recibimos."], ["Si inicias sesión con Google", "Recibimos un ID de cuenta único del inicio de sesión de Google. No guardamos tu correo, contraseña ni contactos. Eliges un apodo, que se muestra públicamente en las clasificaciones. Para los jugadores que inician sesión guardamos el apodo, el progreso de niveles, estrellas, puntuaciones y resultados del desafío semanal, para que conserves tu progreso entre dispositivos y aparezcas en las clasificaciones."], ["Cómo usamos la información", "<ul><li>Para guardar y sincronizar tu progreso.</li><li>Para las clasificaciones y el desafío semanal, que muestran tu apodo, marco de rango y puntuación a otros jugadores.</li><li>Para darte la recompensa tras ver un anuncio con recompensa.</li><li>Para evitar trampas y mantener los apodos libres de palabras ofensivas.</li><li>Para corregir errores y mejorar el juego con informes de fallos anónimos.</li></ul>No vendemos tu información personal."], ["Publicidad", "El juego muestra anuncios de Google AdMob, incluidos anuncios opcionales con recompensa (por ejemplo, «mira un anuncio para +5 movimientos»). Para mostrar y medir anuncios, Google puede recopilar el ID de publicidad del dispositivo, la dirección IP, el tipo de dispositivo y la ubicación aproximada. En el EEE, Reino Unido y Suiza, el juego te pide consentimiento antes de mostrar anuncios personalizados. Puedes restablecer o eliminar tu ID de publicidad en los ajustes de Android. Cómo usa los datos "+ADMOB+"."], ["Servicios que usamos", "Inicio de sesión con Google y Google Firebase (cuenta y base de datos) y Google AdMob (anuncios), todos operados por Google: <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\">policies.google.com/privacy</a>"], ["Eliminar tu cuenta y datos", "Abre el juego y ve a Ajustes → Eliminar cuenta y datos. Esto elimina de forma permanente tu cuenta, apodo, progreso y puntuaciones de nuestros servidores en un plazo de 30 días. Los invitados pueden usar Borrar mi progreso para eliminar los datos de su dispositivo. También puedes solicitar la eliminación por correo, aunque ya no tengas el juego instalado: "+MAIL+""], ["Conservación y seguridad", "Conservamos los datos del juego mientras exista tu cuenta. Se almacenan en servidores de Google Firebase, protegidos con cifrado en tránsito y controles de acceso."], ["Menores", "Gem Bloom es un juego para todos los públicos y no está dirigido a menores de 13 años. No recopilamos conscientemente información personal de menores de 13 años. Si crees que un menor nos ha dado información personal, contáctanos y la eliminaremos."], ["Cambios", "Si cambiamos esta política, actualizaremos la fecha de arriba y te avisaremos en el juego de los cambios importantes."], ["Contacto", "Preguntas o solicitudes de eliminación: "+MAIL+""]]}, "fr": {"n": "Français", "t": "Gem Bloom – Politique de confidentialité", "d": "Date d’entrée en vigueur : 22 octobre 2026", "s": [["Qui sommes-nous", "Gem Bloom (« le jeu ») est développé par Flick Labs. Cette politique explique quelles informations le jeu collecte, pourquoi, et quels choix vous avez. Contact : "+MAIL+""], ["Si vous jouez en invité", "Votre progression, vos étoiles, bonus et réglages sont enregistrés uniquement sur votre appareil. Nous ne les recevons pas."], ["Si vous vous connectez avec Google", "Nous recevons un identifiant de compte unique via la connexion Google. Nous ne conservons ni votre e-mail, ni votre mot de passe, ni vos contacts. Vous choisissez un pseudo, affiché publiquement dans les classements. Pour les joueurs connectés, nous conservons le pseudo, la progression, les étoiles, les scores et les résultats du défi hebdomadaire afin de conserver votre progression entre appareils et de vous faire figurer dans les classements."], ["Utilisation des informations", "<ul><li>Pour enregistrer et synchroniser votre progression.</li><li>Pour les classements et le défi hebdomadaire, qui montrent votre pseudo, votre cadre de rang et votre score aux autres joueurs.</li><li>Pour vous donner la récompense après une publicité avec récompense.</li><li>Pour empêcher la triche et garder les pseudos exempts de mots offensants.</li><li>Pour corriger les problèmes et améliorer le jeu grâce à des rapports de plantage anonymes.</li></ul>Nous ne vendons pas vos informations personnelles."], ["Publicité", "Le jeu affiche des annonces Google AdMob, y compris des publicités facultatives avec récompense (par exemple « regarder une pub pour +5 coups »). Pour diffuser et mesurer les annonces, Google peut collecter l’identifiant publicitaire de l’appareil, l’adresse IP, le type d’appareil et la localisation approximative. Dans l’EEE, au Royaume-Uni et en Suisse, le jeu demande votre consentement avant d’afficher des annonces personnalisées. Vous pouvez réinitialiser ou supprimer votre identifiant publicitaire dans les paramètres Android. Comment "+ADMOB+" utilise les données."], ["Services utilisés", "Connexion Google et Google Firebase (compte et base de données) ainsi que Google AdMob (publicité), tous exploités par Google : <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\">policies.google.com/privacy</a>"], ["Supprimer votre compte et vos données", "Ouvrez le jeu et allez dans Paramètres → Supprimer le compte et les données. Votre compte, pseudo, progression et scores sont alors définitivement supprimés de nos serveurs sous 30 jours. Les invités peuvent utiliser Effacer ma progression pour supprimer les données de leur appareil. Vous pouvez aussi demander la suppression par e-mail, même si le jeu n’est plus installé : "+MAIL+""], ["Conservation et sécurité", "Nous conservons les données de jeu tant que votre compte existe. Elles sont stockées sur les serveurs de Google Firebase, protégées par un chiffrement en transit et des contrôles d’accès."], ["Enfants", "Gem Bloom est un jeu tout public qui ne s’adresse pas aux enfants de moins de 13 ans. Nous ne collectons pas sciemment d’informations personnelles d’enfants de moins de 13 ans. Si vous pensez qu’un enfant nous a transmis des informations, contactez-nous et nous les supprimerons."], ["Modifications", "Si nous modifions cette politique, nous mettrons à jour la date ci-dessus et vous informerons dans le jeu des changements importants."], ["Contact", "Questions ou demandes de suppression : "+MAIL+""]]}, "it": {"n": "Italiano", "t": "Gem Bloom – Informativa sulla privacy", "d": "In vigore dal: 22 ottobre 2026", "s": [["Chi siamo", "Gem Bloom (\"il gioco\") è sviluppato da Flick Labs. Questa informativa spiega quali informazioni raccoglie il gioco, perché e quali scelte hai. Contatti: "+MAIL+""], ["Se giochi come ospite", "I tuoi progressi, stelle, potenziamenti e impostazioni sono salvati solo sul tuo dispositivo. Non li riceviamo."], ["Se accedi con Google", "Riceviamo un ID account univoco dall’accesso con Google. Non conserviamo la tua email, la password o i contatti. Scegli un nickname, mostrato pubblicamente nelle classifiche. Per i giocatori che hanno effettuato l’accesso conserviamo nickname, progressi, stelle, punteggi e risultati della sfida settimanale, così mantieni i progressi tra dispositivi e appari nelle classifiche."], ["Come usiamo le informazioni", "<ul><li>Per salvare e sincronizzare i tuoi progressi.</li><li>Per le classifiche e la sfida settimanale, che mostrano nickname, cornice di grado e punteggio agli altri giocatori.</li><li>Per darti la ricompensa dopo un annuncio con premio.</li><li>Per prevenire imbrogli e mantenere i nickname privi di parole offensive.</li><li>Per correggere problemi e migliorare il gioco con report anonimi sugli arresti anomali.</li></ul>Non vendiamo le tue informazioni personali."], ["Pubblicità", "Il gioco mostra annunci di Google AdMob, inclusi annunci facoltativi con premio (ad esempio \"guarda un annuncio per +5 mosse\"). Per mostrare e misurare gli annunci, Google può raccogliere l’ID pubblicitario del dispositivo, l’indirizzo IP, il tipo di dispositivo e la posizione approssimativa. Nel SEE, nel Regno Unito e in Svizzera il gioco chiede il tuo consenso prima di mostrare annunci personalizzati. Puoi reimpostare o eliminare l’ID pubblicitario nelle impostazioni di Android. Come "+ADMOB+" utilizza i dati."], ["Servizi utilizzati", "Accesso con Google e Google Firebase (account e database) e Google AdMob (pubblicità), tutti gestiti da Google: <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\">policies.google.com/privacy</a>"], ["Eliminare account e dati", "Apri il gioco e vai su Impostazioni → Elimina account e dati. In questo modo account, nickname, progressi e punteggi vengono eliminati definitivamente dai nostri server entro 30 giorni. Gli ospiti possono usare Elimina i miei progressi per cancellare i dati sul dispositivo. Puoi anche richiedere l’eliminazione via email, anche se il gioco non è più installato: "+MAIL+""], ["Conservazione e sicurezza", "Conserviamo i dati di gioco finché esiste il tuo account. Sono archiviati sui server di Google Firebase e protetti con crittografia in transito e controlli di accesso."], ["Minori", "Gem Bloom è un gioco per tutti e non è rivolto a minori di 13 anni. Non raccogliamo consapevolmente informazioni personali da minori di 13 anni. Se ritieni che un minore ci abbia fornito informazioni, contattaci e le elimineremo."], ["Modifiche", "Se modifichiamo questa informativa, aggiorneremo la data qui sopra e ti avviseremo nel gioco delle modifiche importanti."], ["Contatti", "Domande o richieste di eliminazione: "+MAIL+""]]}, "ja": {"n": "日本語", "t": "Gem Bloom – プライバシーポリシー", "d": "施行日：2026年10月22日", "s": [["運営者", "Gem Bloom（以下「本ゲーム」）は Flick Labs が開発しています。本ポリシーでは、本ゲームが収集する情報、その理由、およびあなたが選べる設定について説明します。お問い合わせ："+MAIL+""], ["ゲストとして遊ぶ場合", "進行状況、星、ブースター、設定は端末内にのみ保存され、当方には送信されません。"], ["Google でログインする場合", "Google ログインから固有のアカウントIDを受け取ります。メールアドレス、パスワード、連絡先は保存しません。ニックネームはご自身で決め、ランキングで公開表示されます。ログインしたプレイヤーについては、端末をまたいで進行を引き継ぎ、ランキングに参加できるよう、ニックネーム、レベル進行、星、スコア、ウィークリーチャレンジの結果を保存します。"], ["情報の利用目的", "<ul><li>進行状況の保存と同期のため。</li><li>ニックネーム、ランクフレーム、スコアを他のプレイヤーに表示するランキングとウィークリーチャレンジの運営のため。</li><li>リワード広告視聴後に報酬を付与するため。</li><li>不正行為を防ぎ、ニックネームから不適切な言葉を除くため。</li><li>匿名のクラッシュレポートで不具合を修正し、ゲームを改善するため。</li></ul>個人情報を販売することはありません。"], ["広告", "本ゲームは任意のリワード広告（例：「広告を見て +5 手」）を含む Google AdMob の広告を表示します。広告の配信と測定のため、Google は広告ID、IPアドレス、端末の種類、おおよその位置情報を収集する場合があります。EEA、英国、スイスでは、パーソナライズ広告の表示前に同意を求めます。広告IDは Android の設定でリセットまたは削除できます。"+ADMOB+" によるデータの使用について。"], ["利用しているサービス", "Google ログイン、Google Firebase（アカウントとデータベース）、Google AdMob（広告）。いずれも Google が運営しています：<a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\">policies.google.com/privacy</a>"], ["アカウントとデータの削除", "ゲーム内の「設定 → アカウントとデータを削除」から削除できます。アカウント、ニックネーム、進行状況、スコアは30日以内に当方のサーバーから完全に削除されます。ゲストは「進行状況を削除」で端末内のデータを消去できます。ゲームをアンインストールした後でも、メールで削除を依頼できます："+MAIL+""], ["保存期間と安全管理", "アカウントが存在する間、ゲームデータを保存します。データは Google Firebase のサーバーに保存され、通信時の暗号化とアクセス制御で保護されています。"], ["お子様", "Gem Bloom は一般向けのゲームで、13歳未満のお子様を対象としていません。13歳未満のお子様の個人情報を意図的に収集することはありません。お子様が個人情報を提供したと思われる場合はご連絡ください。削除いたします。"], ["変更", "本ポリシーを変更する場合は上記の日付を更新し、重要な変更はゲーム内でお知らせします。"], ["お問い合わせ", "ご質問や削除のご依頼："+MAIL+""]]}, "ko": {"n": "한국어", "t": "Gem Bloom – 개인정보처리방침", "d": "시행일: 2026년 10월 22일", "s": [["운영자", "Gem Bloom(이하 \"게임\")은 Flick Labs가 개발했습니다. 이 방침은 게임이 어떤 정보를 왜 수집하는지, 그리고 사용자가 선택할 수 있는 사항을 설명합니다. 문의: "+MAIL+""], ["게스트로 플레이하는 경우", "진행 상황, 별, 부스터, 설정은 기기에만 저장되며 저희에게 전송되지 않습니다."], ["Google로 로그인하는 경우", "Google 로그인에서 고유 계정 ID를 받습니다. 이메일 주소, 비밀번호, 연락처는 저장하지 않습니다. 직접 정한 닉네임은 순위표에 공개적으로 표시됩니다. 로그인한 플레이어의 경우 기기 간 진행을 유지하고 순위표에 표시될 수 있도록 닉네임, 레벨 진행, 별, 점수, 주간 챌린지 결과를 저장합니다."], ["정보 이용 방법", "<ul><li>진행 상황을 저장하고 동기화하기 위해.</li><li>닉네임, 등급 테두리, 점수를 다른 플레이어에게 보여 주는 순위표와 주간 챌린지 운영을 위해.</li><li>보상형 광고 시청 후 보상을 지급하기 위해.</li><li>부정행위를 막고 닉네임에서 부적절한 단어를 걸러 내기 위해.</li><li>익명 오류 보고서로 문제를 해결하고 게임을 개선하기 위해.</li></ul>개인정보를 판매하지 않습니다."], ["광고", "게임은 선택형 보상형 광고(예: \"광고 보고 +5 이동\")를 포함한 Google AdMob 광고를 표시합니다. 광고를 게재하고 측정하기 위해 Google은 기기 광고 ID, IP 주소, 기기 유형, 대략적인 위치를 수집할 수 있습니다. EEA, 영국, 스위스에서는 맞춤 광고 전에 동의를 요청합니다. 광고 ID는 Android 설정에서 재설정하거나 삭제할 수 있습니다. "+ADMOB+"의 데이터 사용 방식."], ["사용하는 서비스", "Google 로그인, Google Firebase(계정 및 데이터베이스), Google AdMob(광고). 모두 Google이 운영합니다: <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\">policies.google.com/privacy</a>"], ["계정 및 데이터 삭제", "게임에서 설정 → 계정 및 데이터 삭제로 이동하세요. 계정, 닉네임, 진행 상황, 점수가 30일 이내에 서버에서 영구 삭제됩니다. 게스트는 \"내 진행 상황 삭제\"로 기기의 데이터를 지울 수 있습니다. 게임을 삭제한 후에도 이메일로 삭제를 요청할 수 있습니다: "+MAIL+""], ["보관 및 보안", "계정이 있는 동안 게임 데이터를 보관합니다. 데이터는 Google Firebase 서버에 저장되며 전송 중 암호화와 접근 통제로 보호됩니다."], ["아동", "Gem Bloom은 전체 이용가 게임이며 13세 미만 아동을 대상으로 하지 않습니다. 13세 미만 아동의 개인정보를 고의로 수집하지 않습니다. 아동이 개인정보를 제공했다고 생각되면 연락해 주세요. 삭제하겠습니다."], ["변경", "이 방침을 변경하면 위의 날짜를 업데이트하고, 중요한 변경 사항은 게임 내에서 알려 드립니다."], ["문의", "질문 또는 삭제 요청: "+MAIL+""]]}, "nl": {"n": "Nederlands", "t": "Gem Bloom – Privacybeleid", "d": "Ingangsdatum: 22 oktober 2026", "s": [["Wie wij zijn", "Gem Bloom (\"het spel\") is ontwikkeld door Flick Labs. Dit beleid legt uit welke informatie het spel verzamelt, waarom, en welke keuzes je hebt. Contact: "+MAIL+""], ["Als je als gast speelt", "Je voortgang, sterren, boosters en instellingen worden alleen op je apparaat opgeslagen. Wij ontvangen ze niet."], ["Als je inlogt met Google", "We ontvangen een unieke account-ID via Google-inloggen. We bewaren je e-mailadres, wachtwoord of contacten niet. Je kiest een bijnaam die openbaar in de ranglijsten wordt getoond. Voor ingelogde spelers bewaren we bijnaam, levelvoortgang, sterren, scores en resultaten van de wekelijkse uitdaging, zodat je voortgang op al je apparaten behouden blijft en je in de ranglijsten staat."], ["Hoe we informatie gebruiken", "<ul><li>Om je voortgang op te slaan en te synchroniseren.</li><li>Voor ranglijsten en de wekelijkse uitdaging, die je bijnaam, rangkader en score aan andere spelers tonen.</li><li>Om je de beloning te geven na een advertentie met beloning.</li><li>Om valsspelen te voorkomen en bijnamen vrij te houden van beledigende woorden.</li><li>Om problemen op te lossen en het spel te verbeteren met anonieme crashrapporten.</li></ul>We verkopen je persoonsgegevens niet."], ["Advertenties", "Het spel toont advertenties van Google AdMob, waaronder optionele advertenties met beloning (bijvoorbeeld \"bekijk een advertentie voor +5 zetten\"). Om advertenties te tonen en te meten kan Google de advertentie-ID van je apparaat, IP-adres, apparaattype en geschatte locatie verzamelen. In de EER, het VK en Zwitserland vraagt het spel om toestemming voordat gepersonaliseerde advertenties worden getoond. Je advertentie-ID kun je resetten of verwijderen in de Android-instellingen. Hoe "+ADMOB+" gegevens gebruikt."], ["Diensten die we gebruiken", "Inloggen met Google en Google Firebase (account en database) en Google AdMob (advertenties), allemaal beheerd door Google: <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\">policies.google.com/privacy</a>"], ["Je account en gegevens verwijderen", "Open het spel en ga naar Instellingen → Account en gegevens verwijderen. Je account, bijnaam, voortgang en scores worden dan binnen 30 dagen definitief van onze servers verwijderd. Gasten kunnen met Mijn voortgang wissen de gegevens op hun apparaat verwijderen. Je kunt ook per e-mail om verwijdering vragen, ook als het spel niet meer geïnstalleerd is: "+MAIL+""], ["Bewaring en beveiliging", "We bewaren spelgegevens zolang je account bestaat. De gegevens staan op servers van Google Firebase en zijn beschermd met versleuteling tijdens verzending en toegangscontrole."], ["Kinderen", "Gem Bloom is een spel voor alle leeftijden en is niet bedoeld voor kinderen jonger dan 13 jaar. We verzamelen niet bewust persoonsgegevens van kinderen jonger dan 13. Denk je dat een kind ons gegevens heeft gegeven, neem dan contact op en we verwijderen ze."], ["Wijzigingen", "Als we dit beleid wijzigen, passen we de datum hierboven aan en melden we belangrijke wijzigingen in het spel."], ["Contact", "Vragen of verzoeken tot verwijdering: "+MAIL+""]]}, "pt": {"n": "Português", "t": "Gem Bloom – Política de Privacidade", "d": "Data de vigência: 22 de outubro de 2026", "s": [["Quem somos", "Gem Bloom (\"o jogo\") é desenvolvido pela Flick Labs. Esta política explica quais informações o jogo coleta, por quê, e quais escolhas você tem. Contato: "+MAIL+""], ["Se você joga como convidado", "Seu progresso, estrelas, reforços e configurações ficam salvos apenas no seu aparelho. Não os recebemos."], ["Se você entra com o Google", "Recebemos um ID de conta único do login do Google. Não guardamos seu e-mail, senha ou contatos. Você escolhe um apelido, que aparece publicamente nos rankings. Para jogadores conectados, guardamos apelido, progresso de fases, estrelas, pontuações e resultados do desafio semanal, para que você mantenha o progresso entre aparelhos e apareça nos rankings."], ["Como usamos as informações", "<ul><li>Para salvar e sincronizar seu progresso.</li><li>Para os rankings e o desafio semanal, que mostram seu apelido, moldura de nível e pontuação a outros jogadores.</li><li>Para entregar a recompensa depois de um anúncio premiado.</li><li>Para evitar trapaças e manter apelidos livres de palavras ofensivas.</li><li>Para corrigir problemas e melhorar o jogo com relatórios de falhas anônimos.</li></ul>Não vendemos suas informações pessoais."], ["Publicidade", "O jogo exibe anúncios do Google AdMob, incluindo anúncios premiados opcionais (por exemplo, \"assista a um anúncio para +5 jogadas\"). Para exibir e medir anúncios, o Google pode coletar o ID de publicidade do aparelho, endereço IP, tipo de aparelho e localização aproximada. No EEE, Reino Unido e Suíça, o jogo pede seu consentimento antes de exibir anúncios personalizados. Você pode redefinir ou excluir seu ID de publicidade nas configurações do Android. Como o "+ADMOB+" usa os dados."], ["Serviços que usamos", "Login do Google e Google Firebase (conta e banco de dados) e Google AdMob (anúncios), todos operados pelo Google: <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\">policies.google.com/privacy</a>"], ["Excluir sua conta e dados", "Abra o jogo e vá em Configurações → Excluir conta e dados. Isso exclui permanentemente sua conta, apelido, progresso e pontuações dos nossos servidores em até 30 dias. Convidados podem usar Apagar meu progresso para apagar os dados do aparelho. Você também pode pedir a exclusão por e-mail, mesmo sem o jogo instalado: "+MAIL+""], ["Retenção e segurança", "Guardamos os dados do jogo enquanto sua conta existir. Eles ficam nos servidores do Google Firebase, protegidos com criptografia em trânsito e controles de acesso."], ["Crianças", "Gem Bloom é um jogo para todos os públicos e não é direcionado a crianças menores de 13 anos. Não coletamos intencionalmente informações pessoais de menores de 13 anos. Se acreditar que uma criança nos forneceu dados, entre em contato e nós os excluiremos."], ["Alterações", "Se mudarmos esta política, atualizaremos a data acima e avisaremos no jogo sobre mudanças importantes."], ["Contato", "Dúvidas ou pedidos de exclusão: "+MAIL+""]]}};
const order=['en','de','tr','es','fr','it','ja','ko','nl','pt'];
function pick(){
  const q=new URLSearchParams(location.search).get('lang'); if(q&&L[q]) return q;
  const n=(navigator.language||'en').slice(0,2); return L[n]?n:'en';
}
function show(k){
  const x=L[k]; document.documentElement.lang=k; document.title=x.t;
  document.getElementById('t').textContent=x.t; document.getElementById('d').textContent=x.d;
  document.getElementById('body').innerHTML=x.s.map(([h,p])=>'<h2>'+h+'</h2>'+(p.startsWith('<ul>')?p:'<p>'+p+'</p>')).join('');
  document.querySelectorAll('#langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));
}
document.getElementById('langs').innerHTML=order.map(k=>'<button data-k="'+k+'">'+L[k].n+'</button>').join('');
document.querySelectorAll('#langs button').forEach(b=>b.onclick=()=>show(b.dataset.k));
show(pick());
</script>
