<noscript><p>OkayEat reads barcodes with your camera on your device and sends only the barcode number to Open Food Facts to look up the product. Your preferences and scan history stay on your device. Ads are provided by Google AdMob. Contact: flicklabsapp@gmail.com</p></noscript>
<script>
const MAIL='<a href="mailto:flicklabsapp@gmail.com">flicklabsapp@gmail.com</a>';
const ADMOB='<a href="https://policies.google.com/technologies/partner-sites" target="_blank" rel="noopener">Google</a>';
const OFF='<a href="https://world.openfoodfacts.org/privacy" target="_blank" rel="noopener">openfoodfacts.org</a>';
const L={"en": {"n": "English", "t": "OkayEat – Privacy Policy", "d": "Effective date: 22 October 2026", "s": [["Who we are", "OkayEat: Food Scanner (\"OkayEat\", \"the app\") is developed by Flick Labs. It scans food barcodes and warns you about ingredients you want to avoid. This policy explains what information the app uses and how. Contact: {MAIL}"], ["Camera", "The app uses your camera only to read barcodes. The camera image is processed on your device in real time. We do not take, save, upload or share photos."], ["Product lookups", "To show product details, the app sends the scanned barcode number to Open Food Facts, a free, open food database ({OFF}). Like any internet request, this also includes technical information such as your IP address and app version. No personal information, preferences or account details are sent. Open Food Facts handles this data under its own privacy policy."], ["Your preferences and scan history", "The ingredients and diets you choose to avoid (for example allergens, halal, vegan or custom words) and your scan history are saved only on your device. They are never sent to us, to Open Food Facts or to advertisers."], ["Information we collect", "We do not collect personal information. The app has no accounts and no sign-in."], ["Advertising", "The app shows ads provided by Google AdMob. To show and measure ads, Google may collect and use information such as your device advertising ID, IP address, device type and approximate location. In the EEA, UK and Switzerland the app asks for your consent before personalized ads are shown, and you can change your choice anytime in Settings. You can also reset or delete your advertising ID in your Android settings. Learn how {ADMOB} uses data."], ["About product information", "Product data comes from a community database and may be incomplete, outdated or wrong. OkayEat is a helpful tool, not medical advice. If you have a serious allergy or dietary requirement, always check the label on the package."], ["Children", "OkayEat is not directed to children under 13 and we do not knowingly collect information from children."], ["Deleting your data", "You can clear your scan history and preferences anytime in the app. Uninstalling the app removes all of its data from your device. Because we do not collect your data, nothing is stored on our side."], ["Changes", "We may update this policy. The latest version is always available on this page."], ["Contact", "Questions or requests: {MAIL}"]]}, "de": {"n": "Deutsch", "t": "OkayEat – Datenschutzerklärung", "d": "Gültig ab: 22. Oktober 2026", "s": [["Wer wir sind", "OkayEat: Lebensmittel-Scanner („OkayEat“, „die App“) wird von Flick Labs entwickelt. Die App scannt Barcodes von Lebensmitteln und warnt dich vor Zutaten, die du meiden möchtest. Diese Erklärung beschreibt, welche Informationen die App wie nutzt. Kontakt: {MAIL}"], ["Kamera", "Die App nutzt deine Kamera nur zum Lesen von Barcodes. Das Kamerabild wird in Echtzeit auf deinem Gerät verarbeitet. Wir machen, speichern, laden oder teilen keine Fotos."], ["Produktabfragen", "Um Produktdetails anzuzeigen, sendet die App die gescannte Barcode-Nummer an Open Food Facts, eine freie, offene Lebensmitteldatenbank ({OFF}). Wie jede Internetanfrage enthält dies auch technische Informationen wie deine IP-Adresse und die App-Version. Es werden keine personenbezogenen Daten, Einstellungen oder Kontodaten gesendet. Open Food Facts verarbeitet diese Daten gemäß seiner eigenen Datenschutzerklärung."], ["Deine Einstellungen und dein Scan-Verlauf", "Die Zutaten und Ernährungsformen, die du meiden möchtest (z. B. Allergene, halal, vegan oder eigene Begriffe), und dein Scan-Verlauf werden nur auf deinem Gerät gespeichert. Sie werden niemals an uns, an Open Food Facts oder an Werbetreibende gesendet."], ["Welche Daten wir erheben", "Wir erheben keine personenbezogenen Daten. Die App hat keine Konten und keine Anmeldung."], ["Werbung", "Die App zeigt Anzeigen von Google AdMob. Um Anzeigen auszuliefern und zu messen, kann Google Informationen wie die Werbe-ID deines Geräts, die IP-Adresse, den Gerätetyp und den ungefähren Standort erheben und nutzen. Im EWR, im Vereinigten Königreich und in der Schweiz bittet die App vor personalisierter Werbung um deine Einwilligung; du kannst deine Wahl jederzeit in den Einstellungen ändern. Die Werbe-ID kannst du in den Android-Einstellungen zurücksetzen oder löschen. So nutzt {ADMOB} Daten."], ["Hinweis zu Produktinformationen", "Die Produktdaten stammen aus einer Community-Datenbank und können unvollständig, veraltet oder falsch sein. OkayEat ist ein hilfreiches Werkzeug, aber keine medizinische Beratung. Bei schweren Allergien oder besonderen Ernährungsanforderungen prüfe immer das Etikett auf der Verpackung."], ["Kinder", "OkayEat richtet sich nicht an Kinder unter 13 Jahren, und wir erheben wissentlich keine Daten von Kindern."], ["Löschen deiner Daten", "Du kannst deinen Scan-Verlauf und deine Einstellungen jederzeit in der App löschen. Durch Deinstallieren der App werden alle ihre Daten von deinem Gerät entfernt. Da wir keine Daten erheben, wird bei uns nichts gespeichert."], ["Änderungen", "Wir können diese Erklärung aktualisieren. Die aktuelle Version findest du immer auf dieser Seite."], ["Kontakt", "Fragen oder Anfragen: {MAIL}"]]}, "tr": {"n": "Türkçe", "t": "OkayEat – Gizlilik Politikası", "d": "Yürürlük tarihi: 22 Ekim 2026", "s": [["Biz kimiz", "OkayEat: Gıda Tarayıcı (\"OkayEat\", \"uygulama\") Flick Labs tarafından geliştirilmiştir. Uygulama gıda barkodlarını tarar ve kaçınmak istediğin içerikler konusunda seni uyarır. Bu politika, uygulamanın hangi bilgileri nasıl kullandığını açıklar. İletişim: {MAIL}"], ["Kamera", "Uygulama kamerayı yalnızca barkod okumak için kullanır. Kamera görüntüsü anlık olarak cihazında işlenir. Fotoğraf çekmeyiz, kaydetmeyiz, yüklemeyiz ya da paylaşmayız."], ["Ürün sorgulama", "Ürün bilgilerini göstermek için uygulama, taranan barkod numarasını ücretsiz ve açık bir gıda veritabanı olan Open Food Facts'e gönderir ({OFF}). Her internet isteğinde olduğu gibi buna IP adresin ve uygulama sürümü gibi teknik bilgiler de dahildir. Kişisel bilgi, tercih veya hesap bilgisi gönderilmez. Open Food Facts bu verileri kendi gizlilik politikasına göre işler."], ["Tercihlerin ve tarama geçmişin", "Kaçınmak için seçtiğin içerikler ve beslenme tercihleri (örneğin alerjenler, helal, vegan veya kendi eklediğin kelimeler) ile tarama geçmişin yalnızca cihazında saklanır. Bunlar asla bize, Open Food Facts'e veya reklamverenlere gönderilmez."], ["Topladığımız bilgiler", "Kişisel bilgi toplamıyoruz. Uygulamada hesap veya giriş yoktur."], ["Reklamlar", "Uygulama, Google AdMob tarafından sağlanan reklamlar gösterir. Reklamları göstermek ve ölçmek için Google; cihaz reklam kimliği, IP adresi, cihaz türü ve yaklaşık konum gibi bilgileri toplayıp kullanabilir. AEA, Birleşik Krallık ve İsviçre'de kişiselleştirilmiş reklamlardan önce onayın istenir; seçimini istediğin zaman Ayarlar'dan değiştirebilirsin. Reklam kimliğini Android ayarlarından sıfırlayabilir veya silebilirsin. {ADMOB} verileri nasıl kullanır?"], ["Ürün bilgileri hakkında", "Ürün verileri topluluk tarafından oluşturulan bir veritabanından gelir; eksik, güncel olmayan veya hatalı olabilir. OkayEat yardımcı bir araçtır, tıbbi tavsiye değildir. Ciddi bir alerjin veya özel bir beslenme gereksinimin varsa her zaman ambalajdaki etiketi kontrol et."], ["Çocuklar", "OkayEat 13 yaşından küçük çocuklara yönelik değildir ve bilerek çocuklardan bilgi toplamayız."], ["Verilerini silme", "Tarama geçmişini ve tercihlerini istediğin zaman uygulamadan silebilirsin. Uygulamayı kaldırmak tüm verilerini cihazından siler. Verilerini toplamadığımız için bizim tarafımızda saklanan bir şey yoktur."], ["Değişiklikler", "Bu politikayı güncelleyebiliriz. En güncel sürüm her zaman bu sayfadadır."], ["İletişim", "Soru ve talepler için: {MAIL}"]]}, "es": {"n": "Español", "t": "OkayEat – Política de privacidad", "d": "Fecha de entrada en vigor: 22 de octubre de 2026", "s": [["Quiénes somos", "OkayEat: Escáner de alimentos («OkayEat», «la app») está desarrollada por Flick Labs. Escanea códigos de barras de alimentos y te avisa de los ingredientes que quieres evitar. Esta política explica qué información usa la app y cómo. Contacto: {MAIL}"], ["Cámara", "La app usa la cámara solo para leer códigos de barras. La imagen de la cámara se procesa en tu dispositivo en tiempo real. No tomamos, guardamos, subimos ni compartimos fotos."], ["Consultas de productos", "Para mostrar los datos del producto, la app envía el número del código de barras escaneado a Open Food Facts, una base de datos de alimentos libre y abierta ({OFF}). Como cualquier solicitud por internet, incluye información técnica como tu dirección IP y la versión de la app. No se envía información personal, preferencias ni datos de cuenta. Open Food Facts trata estos datos según su propia política de privacidad."], ["Tus preferencias e historial de escaneos", "Los ingredientes y dietas que eliges evitar (por ejemplo alérgenos, halal, vegano o palabras propias) y tu historial de escaneos se guardan solo en tu dispositivo. Nunca se envían a nosotros, a Open Food Facts ni a anunciantes."], ["Información que recopilamos", "No recopilamos información personal. La app no tiene cuentas ni inicio de sesión."], ["Publicidad", "La app muestra anuncios proporcionados por Google AdMob. Para mostrar y medir anuncios, Google puede recopilar y usar información como el ID de publicidad del dispositivo, la dirección IP, el tipo de dispositivo y la ubicación aproximada. En el EEE, Reino Unido y Suiza, la app te pide consentimiento antes de mostrar anuncios personalizados y puedes cambiar tu elección en cualquier momento en Ajustes. También puedes restablecer o eliminar tu ID de publicidad en los ajustes de Android. Cómo usa los datos {ADMOB}."], ["Sobre la información de productos", "Los datos de productos provienen de una base de datos comunitaria y pueden estar incompletos, desactualizados o ser incorrectos. OkayEat es una herramienta de ayuda, no un consejo médico. Si tienes una alergia grave o una necesidad dietética especial, revisa siempre la etiqueta del envase."], ["Menores", "OkayEat no está dirigida a menores de 13 años y no recopilamos conscientemente información de menores."], ["Eliminar tus datos", "Puedes borrar tu historial de escaneos y tus preferencias en cualquier momento desde la app. Al desinstalar la app se eliminan todos sus datos de tu dispositivo. Como no recopilamos tus datos, no guardamos nada en nuestros sistemas."], ["Cambios", "Podemos actualizar esta política. La versión más reciente está siempre en esta página."], ["Contacto", "Preguntas o solicitudes: {MAIL}"]]}, "fr": {"n": "Français", "t": "OkayEat – Politique de confidentialité", "d": "Date d’entrée en vigueur : 22 octobre 2026", "s": [["Qui sommes-nous", "OkayEat : Scanner alimentaire (« OkayEat », « l’application ») est développée par Flick Labs. Elle scanne les codes-barres des aliments et vous avertit des ingrédients que vous souhaitez éviter. Cette politique explique quelles informations l’application utilise et comment. Contact : {MAIL}"], ["Caméra", "L’application utilise la caméra uniquement pour lire les codes-barres. L’image de la caméra est traitée en temps réel sur votre appareil. Nous ne prenons, n’enregistrons, n’envoyons ni ne partageons aucune photo."], ["Recherche de produits", "Pour afficher les informations du produit, l’application envoie le numéro du code-barres scanné à Open Food Facts, une base de données alimentaire libre et ouverte ({OFF}). Comme toute requête Internet, cela inclut des informations techniques telles que votre adresse IP et la version de l’application. Aucune information personnelle, préférence ou donnée de compte n’est envoyée. Open Food Facts traite ces données selon sa propre politique de confidentialité."], ["Vos préférences et votre historique", "Les ingrédients et régimes que vous choisissez d’éviter (par exemple allergènes, halal, végan ou mots personnalisés) et votre historique de scans sont enregistrés uniquement sur votre appareil. Ils ne sont jamais envoyés à nous, à Open Food Facts ni aux annonceurs."], ["Informations collectées", "Nous ne collectons aucune information personnelle. L’application n’a ni compte ni connexion."], ["Publicité", "L’application affiche des annonces fournies par Google AdMob. Pour diffuser et mesurer les annonces, Google peut collecter et utiliser des informations telles que l’identifiant publicitaire de l’appareil, l’adresse IP, le type d’appareil et la localisation approximative. Dans l’EEE, au Royaume-Uni et en Suisse, l’application demande votre consentement avant d’afficher des annonces personnalisées, et vous pouvez modifier votre choix à tout moment dans les Réglages. Vous pouvez aussi réinitialiser ou supprimer votre identifiant publicitaire dans les paramètres Android. Comment {ADMOB} utilise les données."], ["À propos des informations produits", "Les données produits proviennent d’une base de données communautaire et peuvent être incomplètes, obsolètes ou erronées. OkayEat est un outil d’aide, pas un avis médical. En cas d’allergie grave ou de besoin alimentaire particulier, vérifiez toujours l’étiquette de l’emballage."], ["Enfants", "OkayEat ne s’adresse pas aux enfants de moins de 13 ans et nous ne collectons pas sciemment d’informations les concernant."], ["Suppression de vos données", "Vous pouvez effacer votre historique et vos préférences à tout moment dans l’application. La désinstallation de l’application supprime toutes ses données de votre appareil. Comme nous ne collectons pas vos données, rien n’est conservé de notre côté."], ["Modifications", "Nous pouvons mettre à jour cette politique. La dernière version est toujours disponible sur cette page."], ["Contact", "Questions ou demandes : {MAIL}"]]}, "it": {"n": "Italiano", "t": "OkayEat – Informativa sulla privacy", "d": "In vigore dal: 22 ottobre 2026", "s": [["Chi siamo", "OkayEat: Scanner alimentare (\"OkayEat\", \"l’app\") è sviluppata da Flick Labs. Scansiona i codici a barre degli alimenti e ti avvisa degli ingredienti che vuoi evitare. Questa informativa spiega quali informazioni utilizza l’app e come. Contatti: {MAIL}"], ["Fotocamera", "L’app usa la fotocamera solo per leggere i codici a barre. L’immagine della fotocamera viene elaborata in tempo reale sul tuo dispositivo. Non scattiamo, salviamo, carichiamo né condividiamo foto."], ["Ricerca dei prodotti", "Per mostrare i dettagli del prodotto, l’app invia il numero del codice a barre scansionato a Open Food Facts, un database alimentare libero e aperto ({OFF}). Come ogni richiesta internet, include anche informazioni tecniche come il tuo indirizzo IP e la versione dell’app. Non vengono inviate informazioni personali, preferenze o dati di account. Open Food Facts tratta questi dati secondo la propria informativa sulla privacy."], ["Preferenze e cronologia", "Gli ingredienti e le diete che scegli di evitare (ad esempio allergeni, halal, vegano o parole personalizzate) e la cronologia delle scansioni sono salvati solo sul tuo dispositivo. Non vengono mai inviati a noi, a Open Food Facts o agli inserzionisti."], ["Informazioni raccolte", "Non raccogliamo informazioni personali. L’app non ha account né accesso."], ["Pubblicità", "L’app mostra annunci forniti da Google AdMob. Per mostrare e misurare gli annunci, Google può raccogliere e utilizzare informazioni come l’ID pubblicitario del dispositivo, l’indirizzo IP, il tipo di dispositivo e la posizione approssimativa. Nel SEE, nel Regno Unito e in Svizzera l’app chiede il tuo consenso prima di mostrare annunci personalizzati e puoi modificare la scelta in qualsiasi momento nelle Impostazioni. Puoi anche reimpostare o eliminare l’ID pubblicitario nelle impostazioni di Android. Come {ADMOB} utilizza i dati."], ["Informazioni sui prodotti", "I dati dei prodotti provengono da un database della community e possono essere incompleti, non aggiornati o errati. OkayEat è uno strumento di aiuto, non un consiglio medico. In caso di allergie gravi o esigenze alimentari particolari, controlla sempre l’etichetta sulla confezione."], ["Minori", "OkayEat non è rivolta ai minori di 13 anni e non raccogliamo consapevolmente informazioni dai minori."], ["Eliminazione dei dati", "Puoi cancellare cronologia e preferenze in qualsiasi momento dall’app. Disinstallando l’app vengono rimossi tutti i suoi dati dal tuo dispositivo. Poiché non raccogliamo i tuoi dati, non conserviamo nulla."], ["Modifiche", "Potremmo aggiornare questa informativa. La versione più recente è sempre disponibile su questa pagina."], ["Contatti", "Domande o richieste: {MAIL}"]]}, "ja": {"n": "日本語", "t": "OkayEat – プライバシーポリシー", "d": "施行日：2026年10月22日", "s": [["運営者について", "OkayEat：食品スキャナー（以下「OkayEat」「本アプリ」）は Flick Labs が開発しています。本アプリは食品のバーコードを読み取り、避けたい原材料が含まれているとお知らせします。本ポリシーでは、本アプリが利用する情報とその方法を説明します。お問い合わせ：{MAIL}"], ["カメラ", "カメラはバーコードの読み取りにのみ使用します。カメラ映像は端末上でリアルタイムに処理されます。写真の撮影・保存・アップロード・共有は行いません。"], ["商品の検索", "商品情報を表示するため、読み取ったバーコード番号を無料のオープンな食品データベース Open Food Facts（{OFF}）に送信します。一般的なインターネット通信と同様に、IPアドレスやアプリのバージョンなどの技術情報も含まれます。個人情報、設定、アカウント情報は送信されません。Open Food Facts はこれらの情報を独自のプライバシーポリシーに基づいて取り扱います。"], ["設定とスキャン履歴", "避けたい原材料や食習慣（アレルゲン、ハラール、ヴィーガン、独自のキーワードなど）の設定とスキャン履歴は、お使いの端末にのみ保存されます。当社、Open Food Facts、広告主に送信されることはありません。"], ["収集する情報", "当社は個人情報を収集しません。本アプリにはアカウントやログインはありません。"], ["広告", "本アプリは Google AdMob による広告を表示します。広告の表示と効果測定のため、Google は端末の広告ID、IPアドレス、端末の種類、おおよその位置情報などを収集・利用する場合があります。EEA、英国、スイスでは、パーソナライズ広告の表示前に同意を求め、設定からいつでも変更できます。広告IDは Android の設定でリセットまたは削除できます。{ADMOB} によるデータの利用について。"], ["商品情報について", "商品データはコミュニティによるデータベースから提供されており、不完全・古い・誤っている場合があります。OkayEat は便利なツールであり、医学的な助言ではありません。重いアレルギーや特別な食事制限がある場合は、必ずパッケージの表示をご確認ください。"], ["お子様について", "OkayEat は13歳未満のお子様を対象としておらず、お子様の情報を故意に収集することはありません。"], ["データの削除", "スキャン履歴と設定はアプリ内でいつでも消去できます。アプリをアンインストールすると、すべてのデータが端末から削除されます。当社はデータを収集しないため、当社側に保存されるものはありません。"], ["変更", "本ポリシーは更新される場合があります。最新版は常にこのページでご確認いただけます。"], ["お問い合わせ", "ご質問・ご依頼：{MAIL}"]]}, "ko": {"n": "한국어", "t": "OkayEat – 개인정보처리방침", "d": "시행일: 2026년 10월 22일", "s": [["회사 소개", "OkayEat: 식품 스캐너(이하 \"OkayEat\", \"앱\")는 Flick Labs가 개발했습니다. 이 앱은 식품 바코드를 스캔하고 피하고 싶은 성분이 있으면 알려 줍니다. 본 방침은 앱이 어떤 정보를 어떻게 사용하는지 설명합니다. 문의: {MAIL}"], ["카메라", "앱은 바코드를 읽을 때만 카메라를 사용합니다. 카메라 영상은 기기에서 실시간으로 처리됩니다. 사진을 촬영, 저장, 업로드하거나 공유하지 않습니다."], ["제품 조회", "제품 정보를 표시하기 위해 앱은 스캔한 바코드 번호를 무료 공개 식품 데이터베이스인 Open Food Facts({OFF})로 전송합니다. 일반적인 인터넷 요청과 마찬가지로 IP 주소와 앱 버전 같은 기술 정보도 포함됩니다. 개인정보, 설정, 계정 정보는 전송되지 않습니다. Open Food Facts는 자체 개인정보처리방침에 따라 이 데이터를 처리합니다."], ["설정 및 스캔 기록", "피하고 싶은 성분과 식단(예: 알레르기 유발 성분, 할랄, 비건, 직접 추가한 단어) 설정과 스캔 기록은 기기에만 저장됩니다. 당사, Open Food Facts 또는 광고주에게 전송되지 않습니다."], ["수집하는 정보", "당사는 개인정보를 수집하지 않습니다. 앱에는 계정이나 로그인이 없습니다."], ["광고", "앱은 Google AdMob이 제공하는 광고를 표시합니다. 광고를 게재하고 측정하기 위해 Google은 기기 광고 ID, IP 주소, 기기 유형, 대략적인 위치 등의 정보를 수집하고 사용할 수 있습니다. EEA, 영국, 스위스에서는 맞춤 광고 표시 전에 동의를 요청하며, 설정에서 언제든지 변경할 수 있습니다. 광고 ID는 Android 설정에서 재설정하거나 삭제할 수 있습니다. {ADMOB}의 데이터 사용 방법."], ["제품 정보 안내", "제품 데이터는 커뮤니티 데이터베이스에서 제공되며 불완전하거나 오래되었거나 잘못되었을 수 있습니다. OkayEat은 도움을 주는 도구일 뿐 의학적 조언이 아닙니다. 심한 알레르기나 특별한 식이 요구가 있다면 항상 포장의 라벨을 확인하세요."], ["아동", "OkayEat은 13세 미만 아동을 대상으로 하지 않으며 아동의 정보를 고의로 수집하지 않습니다."], ["데이터 삭제", "스캔 기록과 설정은 앱에서 언제든지 삭제할 수 있습니다. 앱을 삭제하면 모든 데이터가 기기에서 제거됩니다. 당사는 데이터를 수집하지 않으므로 당사에 저장되는 것은 없습니다."], ["변경", "본 방침은 업데이트될 수 있습니다. 최신 버전은 항상 이 페이지에서 확인할 수 있습니다."], ["문의", "질문 또는 요청: {MAIL}"]]}, "nl": {"n": "Nederlands", "t": "OkayEat – Privacybeleid", "d": "Ingangsdatum: 22 oktober 2026", "s": [["Wie we zijn", "OkayEat: Voedselscanner (\"OkayEat\", \"de app\") is ontwikkeld door Flick Labs. De app scant barcodes van voedingsmiddelen en waarschuwt je voor ingrediënten die je wilt vermijden. Dit beleid legt uit welke informatie de app gebruikt en hoe. Contact: {MAIL}"], ["Camera", "De app gebruikt je camera alleen om barcodes te lezen. Het camerabeeld wordt in realtime op je apparaat verwerkt. We maken, bewaren, uploaden of delen geen foto’s."], ["Product opzoeken", "Om productinformatie te tonen, stuurt de app het gescande barcodenummer naar Open Food Facts, een gratis, open voedingsdatabase ({OFF}). Zoals bij elk internetverzoek bevat dit ook technische informatie zoals je IP-adres en de appversie. Er worden geen persoonsgegevens, voorkeuren of accountgegevens verzonden. Open Food Facts verwerkt deze gegevens volgens zijn eigen privacybeleid."], ["Je voorkeuren en scangeschiedenis", "De ingrediënten en diëten die je wilt vermijden (bijvoorbeeld allergenen, halal, veganistisch of eigen woorden) en je scangeschiedenis worden alleen op je apparaat bewaard. Ze worden nooit naar ons, naar Open Food Facts of naar adverteerders verzonden."], ["Welke gegevens we verzamelen", "We verzamelen geen persoonsgegevens. De app heeft geen accounts en geen inlog."], ["Advertenties", "De app toont advertenties van Google AdMob. Om advertenties te tonen en te meten, kan Google informatie verzamelen en gebruiken zoals de advertentie-ID van je apparaat, IP-adres, apparaattype en geschatte locatie. In de EER, het VK en Zwitserland vraagt de app om toestemming voordat gepersonaliseerde advertenties worden getoond, en je kunt je keuze altijd wijzigen in Instellingen. Je kunt je advertentie-ID ook resetten of verwijderen in de Android-instellingen. Hoe {ADMOB} gegevens gebruikt."], ["Over productinformatie", "Productgegevens komen uit een communitydatabase en kunnen onvolledig, verouderd of onjuist zijn. OkayEat is een hulpmiddel, geen medisch advies. Heb je een ernstige allergie of een speciaal dieet, controleer dan altijd het etiket op de verpakking."], ["Kinderen", "OkayEat is niet bedoeld voor kinderen jonger dan 13 jaar en we verzamelen niet bewust gegevens van kinderen."], ["Je gegevens verwijderen", "Je kunt je scangeschiedenis en voorkeuren altijd in de app wissen. Als je de app verwijdert, worden al haar gegevens van je apparaat verwijderd. Omdat we je gegevens niet verzamelen, wordt er bij ons niets bewaard."], ["Wijzigingen", "We kunnen dit beleid bijwerken. De nieuwste versie staat altijd op deze pagina."], ["Contact", "Vragen of verzoeken: {MAIL}"]]}, "pt": {"n": "Português", "t": "OkayEat – Política de privacidade", "d": "Data de vigência: 22 de outubro de 2026", "s": [["Quem somos", "OkayEat: Scanner de alimentos (\"OkayEat\", \"o app\") é desenvolvido pela Flick Labs. Ele escaneia códigos de barras de alimentos e avisa sobre ingredientes que você quer evitar. Esta política explica quais informações o app usa e como. Contato: {MAIL}"], ["Câmera", "O app usa a câmera apenas para ler códigos de barras. A imagem da câmera é processada no seu dispositivo em tempo real. Não tiramos, salvamos, enviamos nem compartilhamos fotos."], ["Consulta de produtos", "Para mostrar os dados do produto, o app envia o número do código de barras escaneado para o Open Food Facts, um banco de dados de alimentos livre e aberto ({OFF}). Como qualquer solicitação pela internet, isso inclui informações técnicas como seu endereço IP e a versão do app. Nenhuma informação pessoal, preferência ou dado de conta é enviado. O Open Food Facts trata esses dados conforme sua própria política de privacidade."], ["Suas preferências e histórico", "Os ingredientes e dietas que você escolhe evitar (por exemplo alérgenos, halal, vegano ou palavras próprias) e seu histórico de escaneamentos ficam salvos apenas no seu dispositivo. Eles nunca são enviados para nós, para o Open Food Facts ou para anunciantes."], ["Informações que coletamos", "Não coletamos informações pessoais. O app não tem contas nem login."], ["Publicidade", "O app exibe anúncios fornecidos pelo Google AdMob. Para exibir e medir anúncios, o Google pode coletar e usar informações como o ID de publicidade do dispositivo, endereço IP, tipo de dispositivo e localização aproximada. No EEE, Reino Unido e Suíça, o app pede seu consentimento antes de mostrar anúncios personalizados, e você pode mudar sua escolha a qualquer momento em Configurações. Você também pode redefinir ou excluir seu ID de publicidade nas configurações do Android. Como o {ADMOB} usa os dados."], ["Sobre as informações dos produtos", "Os dados dos produtos vêm de um banco de dados comunitário e podem estar incompletos, desatualizados ou incorretos. O OkayEat é uma ferramenta de apoio, não um conselho médico. Se você tem uma alergia grave ou uma necessidade alimentar especial, sempre confira o rótulo da embalagem."], ["Crianças", "O OkayEat não é direcionado a menores de 13 anos e não coletamos intencionalmente informações de crianças."], ["Excluir seus dados", "Você pode apagar seu histórico e suas preferências a qualquer momento no app. Desinstalar o app remove todos os dados dele do seu dispositivo. Como não coletamos seus dados, nada fica armazenado do nosso lado."], ["Alterações", "Podemos atualizar esta política. A versão mais recente está sempre disponível nesta página."], ["Contato", "Dúvidas ou solicitações: {MAIL}"]]}, "ar": {"n": "العربية", "t": "OkayEat – سياسة الخصوصية", "d": "تاريخ السريان: 22 أكتوبر 2026", "s": [["من نحن", "تطبيق OkayEat: ماسح الأطعمة («OkayEat»، «التطبيق») من تطوير Flick Labs. يمسح التطبيق الرموز الشريطية للأطعمة وينبّهك إلى المكوّنات التي ترغب في تجنّبها. توضح هذه السياسة المعلومات التي يستخدمها التطبيق وكيف يستخدمها. للتواصل: {MAIL}"], ["الكاميرا", "يستخدم التطبيق الكاميرا لقراءة الرموز الشريطية فقط. تُعالَج صورة الكاميرا على جهازك في الوقت الفعلي. نحن لا نلتقط الصور ولا نحفظها ولا نرفعها ولا نشاركها."], ["البحث عن المنتجات", "لعرض تفاصيل المنتج، يرسل التطبيق رقم الرمز الشريطي الممسوح إلى Open Food Facts، وهي قاعدة بيانات مجانية ومفتوحة للأطعمة ({OFF}). وكأي طلب عبر الإنترنت، يتضمن ذلك معلومات تقنية مثل عنوان IP وإصدار التطبيق. لا تُرسل أي معلومات شخصية أو تفضيلات أو بيانات حساب. تعالج Open Food Facts هذه البيانات وفق سياسة الخصوصية الخاصة بها."], ["تفضيلاتك وسجل المسح", "تُحفظ المكوّنات وأنماط الغذاء التي تختار تجنّبها (مثل مسبّبات الحساسية، والحلال، والنباتي، أو كلمات تضيفها بنفسك) وسجل المسح على جهازك فقط، ولا تُرسل أبدًا إلينا أو إلى Open Food Facts أو إلى المعلنين."], ["المعلومات التي نجمعها", "نحن لا نجمع معلومات شخصية. لا يحتوي التطبيق على حسابات أو تسجيل دخول."], ["الإعلانات", "يعرض التطبيق إعلانات تقدّمها Google AdMob. لعرض الإعلانات وقياسها، قد تجمع Google معلومات مثل معرّف الإعلانات لجهازك وعنوان IP ونوع الجهاز والموقع التقريبي وتستخدمها. في المنطقة الاقتصادية الأوروبية والمملكة المتحدة وسويسرا، يطلب التطبيق موافقتك قبل عرض إعلانات مخصّصة، ويمكنك تغيير اختيارك في أي وقت من الإعدادات. يمكنك أيضًا إعادة تعيين معرّف الإعلانات أو حذفه من إعدادات Android. تعرّف على كيفية استخدام {ADMOB} للبيانات."], ["حول معلومات المنتجات", "تأتي بيانات المنتجات من قاعدة بيانات مجتمعية وقد تكون ناقصة أو قديمة أو غير صحيحة. OkayEat أداة مساعدة وليس نصيحة طبية. إذا كانت لديك حساسية شديدة أو احتياجات غذائية خاصة، فتحقّق دائمًا من الملصق على العبوة."], ["الأطفال", "OkayEat ليس موجّهًا للأطفال دون 13 عامًا، ولا نجمع عن علم معلومات من الأطفال."], ["حذف بياناتك", "يمكنك مسح سجل المسح وتفضيلاتك في أي وقت من داخل التطبيق. يؤدي إلغاء تثبيت التطبيق إلى إزالة جميع بياناته من جهازك. بما أننا لا نجمع بياناتك، فلا يُخزَّن شيء لدينا."], ["التغييرات", "قد نحدّث هذه السياسة. تتوفر أحدث نسخة دائمًا في هذه الصفحة."], ["التواصل", "للأسئلة أو الطلبات: {MAIL}"]]}};
for(const k in L)L[k].s=L[k].s.map(([h,p])=>[h,p.split("{MAIL}").join(MAIL).split("{ADMOB}").join(ADMOB).split("{OFF}").join(OFF)]);
const order=['en','de','tr','es','fr','it','ja','ko','nl','pt','ar'];
function pick(){
  const q=new URLSearchParams(location.search).get('lang'); if(q&&L[q]) return q;
  const n=(navigator.language||'en').slice(0,2); return L[n]?n:'en';
}
function show(k){
  const x=L[k]; document.documentElement.lang=k; document.documentElement.dir=k==='ar'?'rtl':'ltr'; document.title=x.t;
  document.getElementById('t').textContent=x.t; document.getElementById('d').textContent=x.d;
  document.getElementById('body').innerHTML=x.s.map(([h,p])=>'<h2>'+h+'</h2>'+(p.startsWith('<ul>')?p:'<p>'+p+'</p>')).join('');
  document.querySelectorAll('#langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));
}
document.getElementById('langs').innerHTML=order.map(k=>'<button data-k="'+k+'">'+L[k].n+'</button>').join('');
document.querySelectorAll('#langs button').forEach(b=>b.onclick=()=>show(b.dataset.k));
show(pick());
</script>
