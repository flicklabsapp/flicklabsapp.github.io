<noscript><p>OkayEat reads barcodes with your camera on your device and sends only the barcode number to Open Food Facts to look up the product. Your preferences and scan history stay on your device. Ads are provided by Google AdMob. Contact: flicklabsapp@gmail.com</p></noscript>
<script>
const MAIL='<a href="mailto:flicklabsapp@gmail.com">flicklabsapp@gmail.com</a>';
const ADMOB='<a href="https://policies.google.com/technologies/partner-sites" target="_blank" rel="noopener">Google</a>';
const OFF='<a href="https://world.openfoodfacts.org/privacy" target="_blank" rel="noopener">openfoodfacts.org</a>';
const USDA='<a href="https://www.usda.gov/privacy-policy" target="_blank" rel="noopener">fdc.nal.usda.gov</a>';
const MYMEM='<a href="https://mymemory.translated.net" target="_blank" rel="noopener">mymemory.translated.net</a>';
const L={"en": {"n": "English", "t": "OkayEat – Privacy Policy", "d": "Effective date: 23 October 2026", "s": [["Who we are", "OkayEat: Food Scanner (\"OkayEat\", \"the app\") is developed by Flick Labs. It scans food barcodes and warns you about ingredients you want to avoid. This policy explains what information the app uses and how. Contact: {MAIL}"], ["Camera", "The app uses your camera to read barcodes and, only if you choose to, to take a photo of a product's ingredient list. Both are processed on your device: the text in the photo is read on the phone itself (Google ML Kit, offline). Photos are only used to read the text; we do not upload, share or keep them."], ["Product lookups", "To show product details, the app sends the scanned barcode number to Open Food Facts ({OFF}), a free, open food database, and to USDA FoodData Central ({USDA}), the free public food database of the U.S. Department of Agriculture. If you view an ingredient list in another language, the product's ingredient text may be sent to the MyMemory translation service ({MYMEM}). Like any internet request, this also includes technical information such as your IP address. No personal information, preferences or account details are sent. Each service handles this data under its own privacy policy."], ["Your preferences and scan history", "The ingredients and diets you choose to avoid (for example allergens, halal, vegan or custom words) and your scan history are saved only on your device. They are never sent to us, to Open Food Facts or to advertisers."], ["Information we collect", "We do not collect personal information. The app has no accounts and no sign-in."], ["Advertising", "The app shows ads provided by Google AdMob. To show and measure ads, Google may collect and use information such as your device advertising ID, IP address, device type and approximate location. In the EEA, UK and Switzerland the app asks for your consent before personalized ads are shown, and you can change your choice anytime in Settings. You can also reset or delete your advertising ID in your Android settings. Learn how {ADMOB} uses data."], ["About product information", "Product data comes from a community database and may be incomplete, outdated or wrong. OkayEat is a helpful tool, not medical advice. If you have a serious allergy or dietary requirement, always check the label on the package."], ["Children", "OkayEat is not directed to children under 13 and we do not knowingly collect information from children."], ["Deleting your data", "You can clear your scan history and preferences anytime in the app. Uninstalling the app removes all of its data from your device. Because we do not collect your data, nothing is stored on our side."], ["Changes", "We may update this policy. The latest version is always available on this page."], ["Contact", "Questions or requests: {MAIL}"]]}, "de": {"n": "Deutsch", "t": "OkayEat – Datenschutzerklärung", "d": "Gültig ab: 23. Oktober 2026", "s": [["Wer wir sind", "OkayEat: Lebensmittel-Scanner („OkayEat“, „die App“) wird von Flick Labs entwickelt. Die App scannt Barcodes von Lebensmitteln und warnt dich vor Zutaten, die du meiden möchtest. Diese Erklärung beschreibt, welche Informationen die App wie nutzt. Kontakt: {MAIL}"], ["Kamera", "Die App nutzt deine Kamera, um Barcodes zu lesen und – nur wenn du es möchtest – ein Foto der Zutatenliste eines Produkts aufzunehmen. Beides wird auf deinem Gerät verarbeitet: Der Text im Foto wird direkt auf dem Smartphone erkannt (Google ML Kit, offline). Fotos dienen nur zum Lesen des Textes; wir laden sie nicht hoch, teilen sie nicht und bewahren sie nicht auf."], ["Produktabfragen", "Um Produktdetails anzuzeigen, sendet die App die gescannte Barcode-Nummer an Open Food Facts ({OFF}), eine freie, offene Lebensmitteldatenbank, und an USDA FoodData Central ({USDA}), die freie öffentliche Lebensmitteldatenbank des US-Landwirtschaftsministeriums. Wenn du eine Zutatenliste in einer anderen Sprache ansiehst, kann der Zutatentext des Produkts an den Übersetzungsdienst MyMemory ({MYMEM}) gesendet werden. Wie jede Internetanfrage enthält dies auch technische Informationen wie deine IP-Adresse. Es werden keine personenbezogenen Daten, Einstellungen oder Kontodaten gesendet. Jeder Dienst verarbeitet diese Daten gemäß seiner eigenen Datenschutzerklärung."], ["Deine Einstellungen und dein Scan-Verlauf", "Die Zutaten und Ernährungsformen, die du meiden möchtest (z. B. Allergene, halal, vegan oder eigene Begriffe), und dein Scan-Verlauf werden nur auf deinem Gerät gespeichert. Sie werden niemals an uns, an Open Food Facts oder an Werbetreibende gesendet."], ["Welche Daten wir erheben", "Wir erheben keine personenbezogenen Daten. Die App hat keine Konten und keine Anmeldung."], ["Werbung", "Die App zeigt Anzeigen von Google AdMob. Um Anzeigen auszuliefern und zu messen, kann Google Informationen wie die Werbe-ID deines Geräts, die IP-Adresse, den Gerätetyp und den ungefähren Standort erheben und nutzen. Im EWR, im Vereinigten Königreich und in der Schweiz bittet die App vor personalisierter Werbung um deine Einwilligung; du kannst deine Wahl jederzeit in den Einstellungen ändern. Die Werbe-ID kannst du in den Android-Einstellungen zurücksetzen oder löschen. So nutzt {ADMOB} Daten."], ["Hinweis zu Produktinformationen", "Die Produktdaten stammen aus einer Community-Datenbank und können unvollständig, veraltet oder falsch sein. OkayEat ist ein hilfreiches Werkzeug, aber keine medizinische Beratung. Bei schweren Allergien oder besonderen Ernährungsanforderungen prüfe immer das Etikett auf der Verpackung."], ["Kinder", "OkayEat richtet sich nicht an Kinder unter 13 Jahren, und wir erheben wissentlich keine Daten von Kindern."], ["Löschen deiner Daten", "Du kannst deinen Scan-Verlauf und deine Einstellungen jederzeit in der App löschen. Durch Deinstallieren der App werden alle ihre Daten von deinem Gerät entfernt. Da wir keine Daten erheben, wird bei uns nichts gespeichert."], ["Änderungen", "Wir können diese Erklärung aktualisieren. Die aktuelle Version findest du immer auf dieser Seite."], ["Kontakt", "Fragen oder Anfragen: {MAIL}"]]}, "tr": {"n": "Türkçe", "t": "OkayEat – Gizlilik Politikası", "d": "Yürürlük tarihi: 23 Ekim 2026", "s": [["Biz kimiz", "OkayEat: Gıda Tarayıcı (\"OkayEat\", \"uygulama\") Flick Labs tarafından geliştirilmiştir. Uygulama gıda barkodlarını tarar ve kaçınmak istediğin içerikler konusunda seni uyarır. Bu politika, uygulamanın hangi bilgileri nasıl kullandığını açıklar. İletişim: {MAIL}"], ["Kamera", "Uygulama kamerayı barkod okumak için ve yalnızca sen istersen bir ürünün içindekiler listesinin fotoğrafını çekmek için kullanır. İkisi de cihazında işlenir: fotoğraftaki yazı doğrudan telefonda okunur (Google ML Kit, çevrimdışı). Fotoğraflar yalnızca yazıyı okumak için kullanılır; yüklenmez, paylaşılmaz ve saklanmaz."], ["Ürün sorgulama", "Ürün bilgilerini göstermek için uygulama, taranan barkod numarasını ücretsiz ve açık bir gıda veritabanı olan Open Food Facts'e ({OFF}) ve ABD Tarım Bakanlığı'nın ücretsiz kamu gıda veritabanı USDA FoodData Central'a ({USDA}) gönderir. Bir içindekiler listesini başka bir dilde görüntülersen, ürünün içindekiler metni MyMemory çeviri servisine ({MYMEM}) gönderilebilir. Her internet isteğinde olduğu gibi bu, IP adresin gibi teknik bilgileri de içerir. Kişisel bilgi, tercih veya hesap bilgisi gönderilmez. Her servis bu verileri kendi gizlilik politikasına göre işler."], ["Tercihlerin ve tarama geçmişin", "Kaçınmak için seçtiğin içerikler ve beslenme tercihleri (örneğin alerjenler, helal, vegan veya kendi eklediğin kelimeler) ile tarama geçmişin yalnızca cihazında saklanır. Bunlar asla bize, Open Food Facts'e veya reklamverenlere gönderilmez."], ["Topladığımız bilgiler", "Kişisel bilgi toplamıyoruz. Uygulamada hesap veya giriş yoktur."], ["Reklamlar", "Uygulama, Google AdMob tarafından sağlanan reklamlar gösterir. Reklamları göstermek ve ölçmek için Google; cihaz reklam kimliği, IP adresi, cihaz türü ve yaklaşık konum gibi bilgileri toplayıp kullanabilir. AEA, Birleşik Krallık ve İsviçre'de kişiselleştirilmiş reklamlardan önce onayın istenir; seçimini istediğin zaman Ayarlar'dan değiştirebilirsin. Reklam kimliğini Android ayarlarından sıfırlayabilir veya silebilirsin. {ADMOB} verileri nasıl kullanır?"], ["Ürün bilgileri hakkında", "Ürün verileri topluluk tarafından oluşturulan bir veritabanından gelir; eksik, güncel olmayan veya hatalı olabilir. OkayEat yardımcı bir araçtır, tıbbi tavsiye değildir. Ciddi bir alerjin veya özel bir beslenme gereksinimin varsa her zaman ambalajdaki etiketi kontrol et."], ["Çocuklar", "OkayEat 13 yaşından küçük çocuklara yönelik değildir ve bilerek çocuklardan bilgi toplamayız."], ["Verilerini silme", "Tarama geçmişini ve tercihlerini istediğin zaman uygulamadan silebilirsin. Uygulamayı kaldırmak tüm verilerini cihazından siler. Verilerini toplamadığımız için bizim tarafımızda saklanan bir şey yoktur."], ["Değişiklikler", "Bu politikayı güncelleyebiliriz. En güncel sürüm her zaman bu sayfadadır."], ["İletişim", "Soru ve talepler için: {MAIL}"]]}, "es": {"n": "Español", "t": "OkayEat – Política de privacidad", "d": "Fecha de entrada en vigor: 23 de octubre de 2026", "s": [["Quiénes somos", "OkayEat: Escáner de alimentos («OkayEat», «la app») está desarrollada por Flick Labs. Escanea códigos de barras de alimentos y te avisa de los ingredientes que quieres evitar. Esta política explica qué información usa la app y cómo. Contacto: {MAIL}"], ["Cámara", "La app usa la cámara para leer códigos de barras y, solo si tú lo decides, para hacer una foto de la lista de ingredientes de un producto. Ambas cosas se procesan en tu dispositivo: el texto de la foto se lee en el propio teléfono (Google ML Kit, sin conexión). Las fotos solo se usan para leer el texto; no las subimos, compartimos ni guardamos."], ["Consultas de productos", "Para mostrar los detalles del producto, la app envía el número del código de barras escaneado a Open Food Facts ({OFF}), una base de datos de alimentos libre y abierta, y a USDA FoodData Central ({USDA}), la base de datos pública y gratuita de alimentos del Departamento de Agricultura de EE. UU. Si ves una lista de ingredientes en otro idioma, el texto de ingredientes del producto puede enviarse al servicio de traducción MyMemory ({MYMEM}). Como cualquier solicitud por internet, esto también incluye información técnica como tu dirección IP. No se envía información personal, preferencias ni datos de cuenta. Cada servicio trata estos datos según su propia política de privacidad."], ["Tus preferencias e historial de escaneos", "Los ingredientes y dietas que eliges evitar (por ejemplo alérgenos, halal, vegano o palabras propias) y tu historial de escaneos se guardan solo en tu dispositivo. Nunca se envían a nosotros, a Open Food Facts ni a anunciantes."], ["Información que recopilamos", "No recopilamos información personal. La app no tiene cuentas ni inicio de sesión."], ["Publicidad", "La app muestra anuncios proporcionados por Google AdMob. Para mostrar y medir anuncios, Google puede recopilar y usar información como el ID de publicidad del dispositivo, la dirección IP, el tipo de dispositivo y la ubicación aproximada. En el EEE, Reino Unido y Suiza, la app te pide consentimiento antes de mostrar anuncios personalizados y puedes cambiar tu elección en cualquier momento en Ajustes. También puedes restablecer o eliminar tu ID de publicidad en los ajustes de Android. Cómo usa los datos {ADMOB}."], ["Sobre la información de productos", "Los datos de productos provienen de una base de datos comunitaria y pueden estar incompletos, desactualizados o ser incorrectos. OkayEat es una herramienta de ayuda, no un consejo médico. Si tienes una alergia grave o una necesidad dietética especial, revisa siempre la etiqueta del envase."], ["Menores", "OkayEat no está dirigida a menores de 13 años y no recopilamos conscientemente información de menores."], ["Eliminar tus datos", "Puedes borrar tu historial de escaneos y tus preferencias en cualquier momento desde la app. Al desinstalar la app se eliminan todos sus datos de tu dispositivo. Como no recopilamos tus datos, no guardamos nada en nuestros sistemas."], ["Cambios", "Podemos actualizar esta política. La versión más reciente está siempre en esta página."], ["Contacto", "Preguntas o solicitudes: {MAIL}"]]}, "fr": {"n": "Français", "t": "OkayEat – Politique de confidentialité", "d": "Date d’entrée en vigueur : 23 octobre 2026", "s": [["Qui sommes-nous", "OkayEat : Scanner alimentaire (« OkayEat », « l’application ») est développée par Flick Labs. Elle scanne les codes-barres des aliments et vous avertit des ingrédients que vous souhaitez éviter. Cette politique explique quelles informations l’application utilise et comment. Contact : {MAIL}"], ["Caméra", "L'app utilise ton appareil photo pour lire les codes-barres et, uniquement si tu le choisis, pour photographier la liste des ingrédients d'un produit. Les deux sont traités sur ton appareil : le texte de la photo est lu directement sur le téléphone (Google ML Kit, hors ligne). Les photos servent uniquement à lire le texte ; nous ne les envoyons pas, ne les partageons pas et ne les conservons pas."], ["Recherche de produits", "Pour afficher les détails d'un produit, l'app envoie le numéro du code-barres scanné à Open Food Facts ({OFF}), une base de données alimentaire libre et ouverte, et à USDA FoodData Central ({USDA}), la base de données alimentaire publique et gratuite du ministère de l'Agriculture des États-Unis. Si tu affiches une liste d'ingrédients dans une autre langue, le texte des ingrédients du produit peut être envoyé au service de traduction MyMemory ({MYMEM}). Comme toute requête internet, cela inclut aussi des informations techniques comme ton adresse IP. Aucune donnée personnelle, préférence ou information de compte n'est envoyée. Chaque service traite ces données selon sa propre politique de confidentialité."], ["Vos préférences et votre historique", "Les ingrédients et régimes que vous choisissez d’éviter (par exemple allergènes, halal, végan ou mots personnalisés) et votre historique de scans sont enregistrés uniquement sur votre appareil. Ils ne sont jamais envoyés à nous, à Open Food Facts ni aux annonceurs."], ["Informations collectées", "Nous ne collectons aucune information personnelle. L’application n’a ni compte ni connexion."], ["Publicité", "L’application affiche des annonces fournies par Google AdMob. Pour diffuser et mesurer les annonces, Google peut collecter et utiliser des informations telles que l’identifiant publicitaire de l’appareil, l’adresse IP, le type d’appareil et la localisation approximative. Dans l’EEE, au Royaume-Uni et en Suisse, l’application demande votre consentement avant d’afficher des annonces personnalisées, et vous pouvez modifier votre choix à tout moment dans les Réglages. Vous pouvez aussi réinitialiser ou supprimer votre identifiant publicitaire dans les paramètres Android. Comment {ADMOB} utilise les données."], ["À propos des informations produits", "Les données produits proviennent d’une base de données communautaire et peuvent être incomplètes, obsolètes ou erronées. OkayEat est un outil d’aide, pas un avis médical. En cas d’allergie grave ou de besoin alimentaire particulier, vérifiez toujours l’étiquette de l’emballage."], ["Enfants", "OkayEat ne s’adresse pas aux enfants de moins de 13 ans et nous ne collectons pas sciemment d’informations les concernant."], ["Suppression de vos données", "Vous pouvez effacer votre historique et vos préférences à tout moment dans l’application. La désinstallation de l’application supprime toutes ses données de votre appareil. Comme nous ne collectons pas vos données, rien n’est conservé de notre côté."], ["Modifications", "Nous pouvons mettre à jour cette politique. La dernière version est toujours disponible sur cette page."], ["Contact", "Questions ou demandes : {MAIL}"]]}, "it": {"n": "Italiano", "t": "OkayEat – Informativa sulla privacy", "d": "In vigore dal: 23 ottobre 2026", "s": [["Chi siamo", "OkayEat: Scanner alimentare (\"OkayEat\", \"l’app\") è sviluppata da Flick Labs. Scansiona i codici a barre degli alimenti e ti avvisa degli ingredienti che vuoi evitare. Questa informativa spiega quali informazioni utilizza l’app e come. Contatti: {MAIL}"], ["Fotocamera", "L'app usa la fotocamera per leggere i codici a barre e, solo se lo scegli tu, per fotografare l'elenco degli ingredienti di un prodotto. Entrambi vengono elaborati sul tuo dispositivo: il testo della foto viene letto direttamente sul telefono (Google ML Kit, offline). Le foto servono solo a leggere il testo; non le carichiamo, non le condividiamo e non le conserviamo."], ["Ricerca dei prodotti", "Per mostrare i dettagli del prodotto, l'app invia il numero del codice a barre scansionato a Open Food Facts ({OFF}), un database alimentare libero e aperto, e a USDA FoodData Central ({USDA}), il database alimentare pubblico e gratuito del Dipartimento dell'Agricoltura degli Stati Uniti. Se visualizzi un elenco di ingredienti in un'altra lingua, il testo degli ingredienti del prodotto può essere inviato al servizio di traduzione MyMemory ({MYMEM}). Come ogni richiesta internet, ciò include anche informazioni tecniche come il tuo indirizzo IP. Non vengono inviati dati personali, preferenze o dati dell'account. Ogni servizio tratta questi dati secondo la propria informativa sulla privacy."], ["Preferenze e cronologia", "Gli ingredienti e le diete che scegli di evitare (ad esempio allergeni, halal, vegano o parole personalizzate) e la cronologia delle scansioni sono salvati solo sul tuo dispositivo. Non vengono mai inviati a noi, a Open Food Facts o agli inserzionisti."], ["Informazioni raccolte", "Non raccogliamo informazioni personali. L’app non ha account né accesso."], ["Pubblicità", "L’app mostra annunci forniti da Google AdMob. Per mostrare e misurare gli annunci, Google può raccogliere e utilizzare informazioni come l’ID pubblicitario del dispositivo, l’indirizzo IP, il tipo di dispositivo e la posizione approssimativa. Nel SEE, nel Regno Unito e in Svizzera l’app chiede il tuo consenso prima di mostrare annunci personalizzati e puoi modificare la scelta in qualsiasi momento nelle Impostazioni. Puoi anche reimpostare o eliminare l’ID pubblicitario nelle impostazioni di Android. Come {ADMOB} utilizza i dati."], ["Informazioni sui prodotti", "I dati dei prodotti provengono da un database della community e possono essere incompleti, non aggiornati o errati. OkayEat è uno strumento di aiuto, non un consiglio medico. In caso di allergie gravi o esigenze alimentari particolari, controlla sempre l’etichetta sulla confezione."], ["Minori", "OkayEat non è rivolta ai minori di 13 anni e non raccogliamo consapevolmente informazioni dai minori."], ["Eliminazione dei dati", "Puoi cancellare cronologia e preferenze in qualsiasi momento dall’app. Disinstallando l’app vengono rimossi tutti i suoi dati dal tuo dispositivo. Poiché non raccogliamo i tuoi dati, non conserviamo nulla."], ["Modifiche", "Potremmo aggiornare questa informativa. La versione più recente è sempre disponibile su questa pagina."], ["Contatti", "Domande o richieste: {MAIL}"]]}, "ja": {"n": "日本語", "t": "OkayEat – プライバシーポリシー", "d": "施行日：2026年10月23日", "s": [["運営者について", "OkayEat：食品スキャナー（以下「OkayEat」「本アプリ」）は Flick Labs が開発しています。本アプリは食品のバーコードを読み取り、避けたい原材料が含まれているとお知らせします。本ポリシーでは、本アプリが利用する情報とその方法を説明します。お問い合わせ：{MAIL}"], ["カメラ", "アプリはバーコードの読み取りと、あなたが選んだ場合にのみ商品の原材料表示の撮影にカメラを使います。どちらも端末内で処理され、写真の文字はスマートフォン上で読み取られます（Google ML Kit、オフライン）。写真は文字の読み取りにのみ使われ、アップロード・共有・保存はしません。"], ["商品の検索", "商品情報を表示するため、アプリは読み取ったバーコード番号を、無料のオープンな食品データベース Open Food Facts（{OFF}）と、米国農務省の無料公開食品データベース USDA FoodData Central（{USDA}）に送信します。原材料表示を別の言語で表示する場合、商品の原材料テキストが翻訳サービス MyMemory（{MYMEM}）に送信されることがあります。通常のインターネット通信と同様に、IPアドレスなどの技術情報も含まれます。個人情報、設定、アカウント情報は送信されません。各サービスはそれぞれのプライバシーポリシーに従ってデータを取り扱います。"], ["設定とスキャン履歴", "避けたい原材料や食習慣（アレルゲン、ハラール、ヴィーガン、独自のキーワードなど）の設定とスキャン履歴は、お使いの端末にのみ保存されます。当社、Open Food Facts、広告主に送信されることはありません。"], ["収集する情報", "当社は個人情報を収集しません。本アプリにはアカウントやログインはありません。"], ["広告", "本アプリは Google AdMob による広告を表示します。広告の表示と効果測定のため、Google は端末の広告ID、IPアドレス、端末の種類、おおよその位置情報などを収集・利用する場合があります。EEA、英国、スイスでは、パーソナライズ広告の表示前に同意を求め、設定からいつでも変更できます。広告IDは Android の設定でリセットまたは削除できます。{ADMOB} によるデータの利用について。"], ["商品情報について", "商品データはコミュニティによるデータベースから提供されており、不完全・古い・誤っている場合があります。OkayEat は便利なツールであり、医学的な助言ではありません。重いアレルギーや特別な食事制限がある場合は、必ずパッケージの表示をご確認ください。"], ["お子様について", "OkayEat は13歳未満のお子様を対象としておらず、お子様の情報を故意に収集することはありません。"], ["データの削除", "スキャン履歴と設定はアプリ内でいつでも消去できます。アプリをアンインストールすると、すべてのデータが端末から削除されます。当社はデータを収集しないため、当社側に保存されるものはありません。"], ["変更", "本ポリシーは更新される場合があります。最新版は常にこのページでご確認いただけます。"], ["お問い合わせ", "ご質問・ご依頼：{MAIL}"]]}, "ko": {"n": "한국어", "t": "OkayEat – 개인정보처리방침", "d": "시행일: 2026년 10월 23일", "s": [["회사 소개", "OkayEat: 식품 스캐너(이하 \"OkayEat\", \"앱\")는 Flick Labs가 개발했습니다. 이 앱은 식품 바코드를 스캔하고 피하고 싶은 성분이 있으면 알려 줍니다. 본 방침은 앱이 어떤 정보를 어떻게 사용하는지 설명합니다. 문의: {MAIL}"], ["카메라", "앱은 바코드를 읽을 때, 그리고 사용자가 원할 때만 제품의 원재료 목록을 촬영할 때 카메라를 사용합니다. 둘 다 기기 안에서 처리되며 사진 속 글자는 휴대폰에서 직접 인식됩니다(Google ML Kit, 오프라인). 사진은 글자를 읽는 데만 사용되며 업로드, 공유 또는 보관하지 않습니다."], ["제품 조회", "제품 정보를 보여 주기 위해 앱은 스캔한 바코드 번호를 무료 공개 식품 데이터베이스인 Open Food Facts({OFF})와 미국 농무부의 무료 공공 식품 데이터베이스인 USDA FoodData Central({USDA})로 전송합니다. 원재료 목록을 다른 언어로 볼 경우 제품의 원재료 텍스트가 번역 서비스 MyMemory({MYMEM})로 전송될 수 있습니다. 일반적인 인터넷 요청과 마찬가지로 IP 주소 같은 기술 정보도 포함됩니다. 개인정보, 설정 또는 계정 정보는 전송되지 않습니다. 각 서비스는 자체 개인정보 처리방침에 따라 이 데이터를 처리합니다."], ["설정 및 스캔 기록", "피하고 싶은 성분과 식단(예: 알레르기 유발 성분, 할랄, 비건, 직접 추가한 단어) 설정과 스캔 기록은 기기에만 저장됩니다. 당사, Open Food Facts 또는 광고주에게 전송되지 않습니다."], ["수집하는 정보", "당사는 개인정보를 수집하지 않습니다. 앱에는 계정이나 로그인이 없습니다."], ["광고", "앱은 Google AdMob이 제공하는 광고를 표시합니다. 광고를 게재하고 측정하기 위해 Google은 기기 광고 ID, IP 주소, 기기 유형, 대략적인 위치 등의 정보를 수집하고 사용할 수 있습니다. EEA, 영국, 스위스에서는 맞춤 광고 표시 전에 동의를 요청하며, 설정에서 언제든지 변경할 수 있습니다. 광고 ID는 Android 설정에서 재설정하거나 삭제할 수 있습니다. {ADMOB}의 데이터 사용 방법."], ["제품 정보 안내", "제품 데이터는 커뮤니티 데이터베이스에서 제공되며 불완전하거나 오래되었거나 잘못되었을 수 있습니다. OkayEat은 도움을 주는 도구일 뿐 의학적 조언이 아닙니다. 심한 알레르기나 특별한 식이 요구가 있다면 항상 포장의 라벨을 확인하세요."], ["아동", "OkayEat은 13세 미만 아동을 대상으로 하지 않으며 아동의 정보를 고의로 수집하지 않습니다."], ["데이터 삭제", "스캔 기록과 설정은 앱에서 언제든지 삭제할 수 있습니다. 앱을 삭제하면 모든 데이터가 기기에서 제거됩니다. 당사는 데이터를 수집하지 않으므로 당사에 저장되는 것은 없습니다."], ["변경", "본 방침은 업데이트될 수 있습니다. 최신 버전은 항상 이 페이지에서 확인할 수 있습니다."], ["문의", "질문 또는 요청: {MAIL}"]]}, "nl": {"n": "Nederlands", "t": "OkayEat – Privacybeleid", "d": "Ingangsdatum: 23 oktober 2026", "s": [["Wie we zijn", "OkayEat: Voedselscanner (\"OkayEat\", \"de app\") is ontwikkeld door Flick Labs. De app scant barcodes van voedingsmiddelen en waarschuwt je voor ingrediënten die je wilt vermijden. Dit beleid legt uit welke informatie de app gebruikt en hoe. Contact: {MAIL}"], ["Camera", "De app gebruikt je camera om barcodes te lezen en, alleen als jij dat wilt, om een foto te maken van de ingrediëntenlijst van een product. Beide worden op je apparaat verwerkt: de tekst op de foto wordt op de telefoon zelf gelezen (Google ML Kit, offline). Foto's worden alleen gebruikt om de tekst te lezen; we uploaden, delen of bewaren ze niet."], ["Product opzoeken", "Om productgegevens te tonen, stuurt de app het gescande barcodenummer naar Open Food Facts ({OFF}), een vrije, open voedingsdatabase, en naar USDA FoodData Central ({USDA}), de gratis openbare voedingsdatabase van het Amerikaanse ministerie van Landbouw. Als je een ingrediëntenlijst in een andere taal bekijkt, kan de ingrediëntentekst van het product naar de vertaaldienst MyMemory ({MYMEM}) worden gestuurd. Zoals bij elk internetverzoek bevat dit ook technische informatie zoals je IP-adres. Er worden geen persoonsgegevens, voorkeuren of accountgegevens verstuurd. Elke dienst verwerkt deze gegevens volgens zijn eigen privacybeleid."], ["Je voorkeuren en scangeschiedenis", "De ingrediënten en diëten die je wilt vermijden (bijvoorbeeld allergenen, halal, veganistisch of eigen woorden) en je scangeschiedenis worden alleen op je apparaat bewaard. Ze worden nooit naar ons, naar Open Food Facts of naar adverteerders verzonden."], ["Welke gegevens we verzamelen", "We verzamelen geen persoonsgegevens. De app heeft geen accounts en geen inlog."], ["Advertenties", "De app toont advertenties van Google AdMob. Om advertenties te tonen en te meten, kan Google informatie verzamelen en gebruiken zoals de advertentie-ID van je apparaat, IP-adres, apparaattype en geschatte locatie. In de EER, het VK en Zwitserland vraagt de app om toestemming voordat gepersonaliseerde advertenties worden getoond, en je kunt je keuze altijd wijzigen in Instellingen. Je kunt je advertentie-ID ook resetten of verwijderen in de Android-instellingen. Hoe {ADMOB} gegevens gebruikt."], ["Over productinformatie", "Productgegevens komen uit een communitydatabase en kunnen onvolledig, verouderd of onjuist zijn. OkayEat is een hulpmiddel, geen medisch advies. Heb je een ernstige allergie of een speciaal dieet, controleer dan altijd het etiket op de verpakking."], ["Kinderen", "OkayEat is niet bedoeld voor kinderen jonger dan 13 jaar en we verzamelen niet bewust gegevens van kinderen."], ["Je gegevens verwijderen", "Je kunt je scangeschiedenis en voorkeuren altijd in de app wissen. Als je de app verwijdert, worden al haar gegevens van je apparaat verwijderd. Omdat we je gegevens niet verzamelen, wordt er bij ons niets bewaard."], ["Wijzigingen", "We kunnen dit beleid bijwerken. De nieuwste versie staat altijd op deze pagina."], ["Contact", "Vragen of verzoeken: {MAIL}"]]}, "pt": {"n": "Português", "t": "OkayEat – Política de privacidade", "d": "Data de vigência: 23 de outubro de 2026", "s": [["Quem somos", "OkayEat: Scanner de alimentos (\"OkayEat\", \"o app\") é desenvolvido pela Flick Labs. Ele escaneia códigos de barras de alimentos e avisa sobre ingredientes que você quer evitar. Esta política explica quais informações o app usa e como. Contato: {MAIL}"], ["Câmera", "A app usa a câmara para ler códigos de barras e, apenas se tu quiseres, para fotografar a lista de ingredientes de um produto. Ambos são processados no teu dispositivo: o texto da foto é lido no próprio telemóvel (Google ML Kit, offline). As fotos servem apenas para ler o texto; não as enviamos, partilhamos nem guardamos."], ["Consulta de produtos", "Para mostrar os detalhes do produto, a app envia o número do código de barras lido para o Open Food Facts ({OFF}), uma base de dados alimentar livre e aberta, e para o USDA FoodData Central ({USDA}), a base de dados alimentar pública e gratuita do Departamento de Agricultura dos EUA. Se vires uma lista de ingredientes noutro idioma, o texto dos ingredientes do produto pode ser enviado para o serviço de tradução MyMemory ({MYMEM}). Como qualquer pedido pela internet, isto inclui também informação técnica como o teu endereço IP. Não são enviados dados pessoais, preferências ou dados de conta. Cada serviço trata estes dados segundo a sua própria política de privacidade."], ["Suas preferências e histórico", "Os ingredientes e dietas que você escolhe evitar (por exemplo alérgenos, halal, vegano ou palavras próprias) e seu histórico de escaneamentos ficam salvos apenas no seu dispositivo. Eles nunca são enviados para nós, para o Open Food Facts ou para anunciantes."], ["Informações que coletamos", "Não coletamos informações pessoais. O app não tem contas nem login."], ["Publicidade", "O app exibe anúncios fornecidos pelo Google AdMob. Para exibir e medir anúncios, o Google pode coletar e usar informações como o ID de publicidade do dispositivo, endereço IP, tipo de dispositivo e localização aproximada. No EEE, Reino Unido e Suíça, o app pede seu consentimento antes de mostrar anúncios personalizados, e você pode mudar sua escolha a qualquer momento em Configurações. Você também pode redefinir ou excluir seu ID de publicidade nas configurações do Android. Como o {ADMOB} usa os dados."], ["Sobre as informações dos produtos", "Os dados dos produtos vêm de um banco de dados comunitário e podem estar incompletos, desatualizados ou incorretos. O OkayEat é uma ferramenta de apoio, não um conselho médico. Se você tem uma alergia grave ou uma necessidade alimentar especial, sempre confira o rótulo da embalagem."], ["Crianças", "O OkayEat não é direcionado a menores de 13 anos e não coletamos intencionalmente informações de crianças."], ["Excluir seus dados", "Você pode apagar seu histórico e suas preferências a qualquer momento no app. Desinstalar o app remove todos os dados dele do seu dispositivo. Como não coletamos seus dados, nada fica armazenado do nosso lado."], ["Alterações", "Podemos atualizar esta política. A versão mais recente está sempre disponível nesta página."], ["Contato", "Dúvidas ou solicitações: {MAIL}"]]}, "ar": {"n": "العربية", "t": "OkayEat – سياسة الخصوصية", "d": "تاريخ السريان: 23 أكتوبر 2026", "s": [["من نحن", "تطبيق OkayEat: ماسح الأطعمة («OkayEat»، «التطبيق») من تطوير Flick Labs. يمسح التطبيق الرموز الشريطية للأطعمة وينبّهك إلى المكوّنات التي ترغب في تجنّبها. توضح هذه السياسة المعلومات التي يستخدمها التطبيق وكيف يستخدمها. للتواصل: {MAIL}"], ["الكاميرا", "يستخدم التطبيق الكاميرا لقراءة الباركود، ولالتقاط صورة لقائمة مكوّنات المنتج فقط إذا اخترت ذلك. تتم معالجة الأمرين على جهازك: يُقرأ النص الموجود في الصورة على الهاتف نفسه (Google ML Kit، دون اتصال). تُستخدم الصور لقراءة النص فقط؛ لا نرفعها ولا نشاركها ولا نحتفظ بها."], ["البحث عن المنتجات", "لعرض تفاصيل المنتج، يرسل التطبيق رقم الباركود الممسوح إلى Open Food Facts ({OFF})، وهي قاعدة بيانات أغذية مجانية ومفتوحة، وإلى USDA FoodData Central ({USDA})، قاعدة بيانات الأغذية العامة والمجانية التابعة لوزارة الزراعة الأمريكية. إذا عرضت قائمة المكوّنات بلغة أخرى، فقد يُرسل نص مكوّنات المنتج إلى خدمة الترجمة MyMemory ({MYMEM}). وكما في أي طلب عبر الإنترنت، يتضمن ذلك أيضًا معلومات تقنية مثل عنوان IP الخاص بك. لا تُرسل أي معلومات شخصية أو تفضيلات أو بيانات حساب. تعالج كل خدمة هذه البيانات وفق سياسة الخصوصية الخاصة بها."], ["تفضيلاتك وسجل المسح", "تُحفظ المكوّنات وأنماط الغذاء التي تختار تجنّبها (مثل مسبّبات الحساسية، والحلال، والنباتي، أو كلمات تضيفها بنفسك) وسجل المسح على جهازك فقط، ولا تُرسل أبدًا إلينا أو إلى Open Food Facts أو إلى المعلنين."], ["المعلومات التي نجمعها", "نحن لا نجمع معلومات شخصية. لا يحتوي التطبيق على حسابات أو تسجيل دخول."], ["الإعلانات", "يعرض التطبيق إعلانات تقدّمها Google AdMob. لعرض الإعلانات وقياسها، قد تجمع Google معلومات مثل معرّف الإعلانات لجهازك وعنوان IP ونوع الجهاز والموقع التقريبي وتستخدمها. في المنطقة الاقتصادية الأوروبية والمملكة المتحدة وسويسرا، يطلب التطبيق موافقتك قبل عرض إعلانات مخصّصة، ويمكنك تغيير اختيارك في أي وقت من الإعدادات. يمكنك أيضًا إعادة تعيين معرّف الإعلانات أو حذفه من إعدادات Android. تعرّف على كيفية استخدام {ADMOB} للبيانات."], ["حول معلومات المنتجات", "تأتي بيانات المنتجات من قاعدة بيانات مجتمعية وقد تكون ناقصة أو قديمة أو غير صحيحة. OkayEat أداة مساعدة وليس نصيحة طبية. إذا كانت لديك حساسية شديدة أو احتياجات غذائية خاصة، فتحقّق دائمًا من الملصق على العبوة."], ["الأطفال", "OkayEat ليس موجّهًا للأطفال دون 13 عامًا، ولا نجمع عن علم معلومات من الأطفال."], ["حذف بياناتك", "يمكنك مسح سجل المسح وتفضيلاتك في أي وقت من داخل التطبيق. يؤدي إلغاء تثبيت التطبيق إلى إزالة جميع بياناته من جهازك. بما أننا لا نجمع بياناتك، فلا يُخزَّن شيء لدينا."], ["التغييرات", "قد نحدّث هذه السياسة. تتوفر أحدث نسخة دائمًا في هذه الصفحة."], ["التواصل", "للأسئلة أو الطلبات: {MAIL}"]]}};
